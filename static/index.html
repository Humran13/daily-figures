<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1B2430">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Figures">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/app-shell.css">
<title>Daily Figures</title>
<style>
  :root{
    --ink:#1B2430; --ink-soft:#3D4756; --paper:#FCFAF6; --paper-dim:#F1EEE7;
    --line:#DEDACF; --teal:#1F8A70; --teal-dark:#166653; --amber:#E2A93B; --red:#C1443A;
    --mono:'SF Mono','Roboto Mono','Consolas',monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{ margin:0; font-family:var(--sans); background:var(--ink); color:var(--ink); min-height:100vh; }
  .shell{ max-width:520px; margin:0 auto; min-height:100vh; background:var(--paper); display:flex; flex-direction:column; }
  header{ background:var(--ink); color:var(--paper); padding:20px 20px 16px; position:sticky; top:0; z-index:10; }
  header .eyebrow{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#8A94A6; margin:0 0 4px; }
  header h1{ margin:0; font-size:20px; font-weight:700; letter-spacing:-.01em; display:flex; justify-content:space-between; align-items:center;}
  header h1 .logout{ font-size:11px; color:#8A94A6; font-weight:600; cursor:pointer; text-decoration:underline; }
  .tabs{ display:flex; gap:0; margin-top:16px; border-bottom:1px solid #333d4d; }
  .tab{ flex:1; text-align:center; padding:10px 0; font-size:13px; font-weight:600; color:#8A94A6; cursor:pointer; border-bottom:2px solid transparent; }
  .tab.active{ color:var(--paper); border-bottom-color:var(--amber); }
  main{ flex:1; padding:20px; padding-bottom:100px; }
  .setup{ display:flex; gap:10px; margin-bottom:22px; }
  .field{ flex:1; }
  .field label{ display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); margin-bottom:6px; }
  .field input, .field select{ width:100%; padding:11px 10px; border:1.5px solid var(--line); border-radius:8px; font-size:15px; font-family:var(--sans); background:white; color:var(--ink); }
  .field select{ font-weight:600; }
  .progress-wrap{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .progress-track{ flex:1; height:6px; background:var(--paper-dim); border-radius:3px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--teal); border-radius:3px; transition:width .25s ease; }
  .progress-label{ font-family:var(--mono); font-size:12px; color:var(--ink-soft); white-space:nowrap; }
  .card{ background:white; border:1.5px solid var(--line); border-radius:16px; padding:22px 20px; margin-bottom:16px; }
  .product-name{ font-size:22px; font-weight:800; letter-spacing:-.01em; margin:0 0 2px; }
  .product-sub{ font-size:12px; color:var(--ink-soft); margin:0 0 18px; }
  .stock-readout{ display:flex; justify-content:space-between; align-items:center; background:var(--paper-dim); border-radius:10px; padding:12px 14px; margin-bottom:18px; }
  .stock-readout.mt{ margin-top:14px; }
  .stock-readout .lbl{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); }
  .stock-readout .val{ font-family:var(--mono); font-size:20px; font-weight:700; color:var(--ink); }
  /* Tighter vertical rhythm on small phones (~430px and under) — same
     values as the base rules above, just smaller, so the product name,
     Opening Stock, quantity boxes, and Next/Skip buttons fit with less
     scrolling between products. Desktop/tablet (anything wider) is
     completely unaffected — only these overrides are scoped to the
     media query, never the base rules themselves. */
  @media (max-width:430px){
    .card{ padding:14px 12px; margin-bottom:12px; }
    .product-sub{ margin-bottom:10px; }
    .stock-readout{ padding:9px 11px; margin-bottom:10px; }
    .stock-readout.mt{ margin-top:10px; }
    .stock-readout .val{ font-size:17px; }
    .closing-readout{ margin-top:10px; padding:12px; }
    .nav-row{ margin-top:10px; gap:8px; }
    .qty-field input{ padding:9px 4px; }
  }
  .num-field{ margin-bottom:14px; }
  .num-field label{ display:block; font-size:13px; font-weight:700; color:var(--ink); margin-bottom:6px; }
  .num-field .hint{ font-weight:400; color:var(--ink-soft); font-size:11px; }
  .num-field input{ width:100%; padding:16px 14px; border:2px solid var(--line); border-radius:10px; font-family:var(--mono); font-size:24px; font-weight:700; color:var(--ink); background:var(--paper-dim); }
  .num-field input:focus{ outline:none; border-color:var(--teal); background:white; }
  .closing-readout{ margin-top:18px; padding:16px; border-radius:10px; background:var(--ink); color:var(--paper); display:flex; justify-content:space-between; align-items:center; }
  .closing-readout .lbl{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:#8A94A6; }
  .closing-readout .val{ font-family:var(--mono); font-size:26px; font-weight:800; color:var(--amber); }
  .nav-row{ display:flex; gap:10px; margin-top:18px; }
  button{ font-family:var(--sans); cursor:pointer; border:none; }
  .btn{ flex:1; padding:15px; border-radius:10px; font-size:15px; font-weight:700; }
  .btn-primary{ background:var(--teal); color:white; }
  .btn-primary:active{ background:var(--teal-dark); }
  .btn-ghost{ background:var(--paper-dim); color:var(--ink-soft); flex:0 0 90px; }
  .btn-small{ padding:8px 12px; font-size:12px; border-radius:8px; flex:0 0 auto; }
  .btn-skip{ background:none; color:var(--ink-soft); text-decoration:underline; padding:10px; font-size:13px; width:100%; margin-top:4px; font-weight:600; }
  /* Final pre-deployment correction: a REAL secondary button for
     Manager/Super Administrator "Skip for now" — never the unstyled
     text-link look .btn-skip still uses for the Operator workflow
     (unchanged). */
  .btn-skip-review{ background:var(--paper-dim); color:var(--ink-soft); border:1.5px solid var(--line); border-radius:10px; padding:12px; font-size:14px; width:100%; margin-top:8px; font-weight:700; }
  .done-card{ text-align:center; padding:40px 20px; }
  .review-summary{ display:flex; gap:10px; margin-bottom:14px; }
  .review-summary .stat{ flex:1; background:white; border:1.5px solid var(--line); border-radius:10px; padding:10px; text-align:center; }
  .review-summary .stat .n{ font-family:var(--mono); font-size:18px; font-weight:800; }
  .review-summary .stat .l{ font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); }
  .review-row{ background:white; border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px; }
  .review-row .name{ font-weight:700; font-size:14px; }
  .review-row .figures{ font-size:12px; color:var(--ink-soft); font-family:var(--mono); margin:4px 0; }
  .review-row .state{ display:inline-block; padding:2px 8px; border-radius:20px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  .review-state-reviewed, .review-state-edited{ background:#E4F3EC; color:var(--teal-dark); }
  .review-state-skipped{ background:#FBEFD9; color:#8A5A17; }
  .review-state-not_reviewed{ background:var(--paper-dim); color:var(--ink-soft); }
  .review-state-blocked{ background:#F3E4E4; color:var(--red); }
  .review-row .attribution{ font-size:11px; color:var(--ink-soft); margin-top:4px; }
  .review-row .goto{ font-size:12px; text-decoration:underline; color:var(--teal-dark); background:none; padding:0; margin-top:6px; font-weight:600; }
  .done-card .check{ font-size:44px; margin-bottom:10px; }
  .done-card h2{ margin:0 0 8px; font-size:19px; }
  .done-card p{ color:var(--ink-soft); font-size:14px; margin:0 0 20px; }
  .hist-summary{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:18px; }
  /* Operator Daily Figures redesign — a simple, compact, read-only table.
     Deliberately a literal <table> (not the .figure-row card pattern used
     elsewhere) per the exact required column layout; the table container
     scrolls horizontally on its own (mobile) while the rest of the page
     stays fixed-width — never full-page horizontal overflow. */
  .op-note{ font-size:11px; color:var(--ink-soft); margin:0 0 14px; }
  /* Layout correction — a fixed-percentage table (table-layout:fixed with
     narrow % column widths) squeezed multi-digit quantities enough to
     visually overlap neighboring cells on some products/viewports.
     Restored proven pattern: the table keeps a real min-width and each
     column its own min-width (never collapsing below what a quantity
     needs), and ONLY the table's own wrapper scrolls horizontally when
     the viewport is narrower than that — the page/.shell itself never
     gains horizontal overflow, since the scroll container is this wrapper
     alone. */
  .op-swipe-hint{ display:none; font-size:10px; color:var(--ink-soft); text-align:right; margin:0 0 4px; }
  /* overflow-y:auto + max-height make this wrapper (not the page/window)
     the genuine scrolling container the table's sticky th cells stick
     relative to — sticky positions relative to its nearest scrolling
     ancestor, and without a bounded height here this element never
     itself scrolled (its box just grew to fit the table), so the page
     did the real scrolling instead and "sticky" top:0 had no visible
     effect. Mirrors static/dashboard.html's identical .dfig-table-wrap
     fix for the Dashboard's own Daily Figures table. */
  .op-table-wrap{ overflow-x:auto; overflow-y:auto; max-height:60vh; border:1.5px solid var(--line); border-radius:12px; background:white; -webkit-overflow-scrolling:touch; }
  table.op-table{ border-collapse:collapse; width:100%; min-width:600px; font-size:12px; }
  table.op-table th{ position:sticky; top:0; z-index:1; background:var(--paper-dim); text-align:right; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); padding:9px 10px; white-space:nowrap; }
  /* Product column: content-aware, not a huge fixed share of the table —
     min-width is the floor, max-width is the ceiling one unusually long
     name can't push past (see static/dashboard.html's identical .dfig-
     table comment for the full rationale). th:first-child is ALSO
     sticky left (inherits position:sticky/top:0 from the base th rule
     above), making the top-left Product header cell dual-sticky with a
     higher z-index than both the ordinary sticky headers and the sticky
     first body column, so it never gets visually overtaken scrolling
     diagonally. */
  table.op-table th:first-child{ text-align:left; min-width:150px; max-width:180px; left:0; z-index:2; }
  table.op-table th:not(:first-child){ min-width:85px; }
  table.op-table td{ text-align:right; font-family:var(--mono); font-weight:600; padding:9px 10px; border-top:1px solid var(--line); white-space:nowrap; }
  table.op-table td:first-child{ text-align:left; font-family:var(--sans); font-weight:700; color:var(--ink); white-space:normal; word-break:break-word; max-width:180px; position:sticky; left:0; z-index:1; background:white; }
  table.op-table tbody tr:nth-child(even){ background:var(--paper-dim); }
  table.op-table tbody tr:nth-child(even) td:first-child{ background:var(--paper-dim); }
  table.op-table td.op-closing{ font-weight:800; font-size:13px; }
  table.op-table td.op-closing.op-negative{ color:var(--red); background:#F3E4E4; }
  .op-empty{ text-align:center; padding:36px 20px; color:var(--ink-soft); }
  .op-empty p{ margin:0 0 16px; font-size:14px; }
  @media (max-width:600px){ .op-swipe-hint{ display:block; } }
  .hist-stat{ background:white; border:1.5px solid var(--line); border-radius:12px; padding:14px 10px; text-align:center; }
  .hist-stat .n{ font-family:var(--mono); font-size:19px; font-weight:800; color:var(--teal-dark); }
  .hist-stat .l{ font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin-top:2px; }
  .entry-row{ background:white; border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .entry-row .meta{ font-size:11px; color:var(--ink-soft); }
  .entry-row .name{ font-weight:700; font-size:14px; margin:2px 0; }
  .entry-row .nums{ font-family:var(--mono); font-size:12px; color:var(--ink-soft); }
  .entry-row .del{ background:none; color:var(--red); font-size:18px; padding:4px 8px; flex-shrink:0; }
  .empty-state{ text-align:center; padding:50px 20px; color:var(--ink-soft); }
  .empty-state .big{ font-size:34px; margin-bottom:10px; }
  .export-btn{ width:100%; padding:15px; border-radius:10px; background:var(--ink); color:var(--paper); font-weight:700; font-size:14px; margin-top:10px; }
  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:white; padding:12px 20px; border-radius:30px; font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .25s ease; z-index:50; max-width:90%; text-align:center; }
  .toast.show{ opacity:1; }
  .hidden{ display:none !important; }

  .qty-row{ display:flex; gap:8px; }
  .qty-field{ flex:1; text-align:center; }
  .qty-field label{ display:block; font-size:10px; font-weight:700; text-transform:uppercase; color:var(--ink-soft); margin-bottom:4px; }
  .qty-field input{ width:100%; text-align:center; font-family:var(--mono); font-weight:700; font-size:17px; padding:10px 4px; border:2px solid var(--line); border-radius:8px; background:var(--paper-dim); }
  .qty-field input:focus{ outline:none; border-color:var(--teal); background:white; }
  .qty-readout{ font-family:var(--mono); font-size:15px; font-weight:700; }
  .issued-link{ background:none; color:var(--teal-dark); text-decoration:underline; font-size:12px; font-weight:700; padding:0; }
  .adjust-link{ background:none; color:var(--ink-soft); text-decoration:underline; font-size:11px; padding:0; margin-left:8px; }
  .not-configured{ text-align:center; padding:20px; color:var(--ink-soft); font-size:13px; }
  .status-banner{ border-radius:10px; padding:10px 12px; font-size:12px; font-weight:600; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .status-banner.info{ background:#EAF3EF; color:var(--teal-dark); }
  .status-banner.warn{ background:#FCEfd7; color:#8a5a12; }
  .status-banner button{ background:none; text-decoration:underline; font-size:11px; font-weight:700; color:inherit; padding:0; }
  .btn-no-activity{ background:var(--paper-dim); color:var(--ink-soft); padding:12px; border-radius:10px; font-size:13px; font-weight:700; width:100%; margin-top:8px; }
  .modal-backdrop{ position:fixed; inset:0; background:rgba(27,36,48,.6); z-index:60; display:flex; align-items:flex-end; justify-content:center; }
  .modal-sheet{ background:var(--paper); width:100%; max-width:520px; max-height:82vh; overflow-y:auto; border-radius:18px 18px 0 0; padding:20px; }
  .modal-sheet h3{ margin:0 0 12px; font-size:16px; }
  .modal-close{ float:right; background:none; color:var(--ink-soft); font-size:20px; padding:0 4px; }
  .contrib-row{ display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--paper-dim); font-size:13px; }
  .contrib-row .meta{ color:var(--ink-soft); font-size:11px; }
  .contrib-row .del{ background:none; color:var(--red); font-size:11px; text-decoration:underline; padding:0; margin-top:4px; }
  .field textarea{ width:100%; padding:11px 10px; border:1.5px solid var(--line); border-radius:8px; font-size:15px; font-family:var(--sans); background:white; color:var(--ink); min-height:60px; resize:vertical; }
  .msg{ font-size:12px; margin-top:8px; min-height:16px; }
  .msg.err{ color:var(--red); }
  .adjust-confirm-row{ display:flex; justify-content:space-between; padding:6px 0; font-size:13px; }
  .adjust-confirm-row .k{ color:var(--ink-soft); }
  .adjust-confirm-row .v{ font-weight:700; font-family:var(--mono); }
  .filters{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .filters input{ width:auto; flex:1; min-width:110px; font-size:13px; padding:9px 8px; border:1.5px solid var(--line); border-radius:8px; }
  .quick-filters{ display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
  .quick-filters button.active{ background:var(--teal); color:white; }
  .export-row{ display:flex; align-items:center; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .date-group{ margin-bottom:14px; }
  .date-group-head{ display:flex; justify-content:space-between; align-items:center; padding:10px 4px; cursor:pointer; }
  .date-group-head .date{ font-weight:700; font-size:14px; }
  .date-group-head .summary{ font-size:11px; color:var(--ink-soft); }
  .date-group-head .chev{ transition:transform .15s ease; color:var(--ink-soft); }
  .date-group.collapsed .chev{ transform:rotate(-90deg); }
  .date-group.collapsed .date-group-body{ display:none; }

  .login-shell{ min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--ink); }
  .login-card{ background:var(--paper); border-radius:18px; padding:36px 28px; width:min(340px,90vw); text-align:center; }
  .login-card h1{ font-size:20px; margin:0 0 6px; }
  .login-card p{ font-size:13px; color:var(--ink-soft); margin:0 0 20px; }
  .login-card input{ width:100%; padding:16px; font-size:24px; letter-spacing:.3em; text-align:center; font-family:var(--mono); border:2px solid var(--line); border-radius:10px; margin-bottom:14px; }
  .login-card input:focus{ outline:none; border-color:var(--teal); }
  .login-card .err{ color:var(--red); font-size:12px; height:16px; margin-bottom:10px; }
</style>
</head>
<body>

<div id="loginScreen" class="login-shell">
  <div class="login-card">
    <img data-brand-logo class="hidden" alt="" style="max-height:56px;max-width:220px;display:block;margin:0 auto 12px;">
    <h1 data-brand-name>Daily Figures</h1>
    <p>Sign in to continue</p>
    <input type="text" autocomplete="username" id="usernameInput" placeholder="Username" style="margin-bottom:10px;letter-spacing:normal;font-size:16px;text-align:left;">
    <input type="password" autocomplete="current-password" id="passwordInput" placeholder="Password" style="letter-spacing:normal;font-size:16px;text-align:left;">
    <div class="err" id="loginErr"></div>
    <button class="btn btn-primary" id="loginBtn" style="width:100%;">Sign in</button>
  </div>
</div>

<div class="shell hidden" id="appShell">
  <div id="appIdentityBar"></div>
  <header>
    <p class="eyebrow">Production Log</p>
    <h1>Daily Figures</h1>
    <div class="tabs" id="primaryTabs">
      <div class="tab active" data-tab="entry">Enter</div>
      <div class="tab" data-tab="history">History &amp; Export</div>
    </div>
  </header>
  <div id="appRoleNav"></div>
  <main>
    <div id="tab-entry">
      <div class="setup">
        <div class="field"><label>Date</label><input type="date" id="dateInput"></div>
        <div class="field"><label>Shift</label>
          <select id="shiftInput"><option value="Day">Day</option><option value="Night">Night</option></select>
        </div>
      </div>
      <div id="progressWrap" class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-label" id="progressLabel">1 / 16</div>
      </div>
      <div id="entryCard"></div>
      <div id="doneCard" class="hidden"></div>
      <!-- Operator Daily Figures redesign — a simple, read-only, compact
           table replacing the per-product Next/Skip card flow for the
           Operator role only (see boot()'s role branch and
           renderOperatorTable() below). Manager/Super Administrator/
           Viewer are completely unaffected — they still use #entryCard/
           #doneCard above exactly as before. -->
      <div id="operatorTable" class="hidden"></div>
      <!-- Final pre-deployment correction: Manager/Super Administrator
           final review screen — replaces the Operator-only "done" card
           for elevated roles. Reaching the end of the product list never
           submits anything by itself; this screen is where an explicit,
           confirmed submission actually happens (see showReviewScreen()). -->
      <div id="reviewCard" class="hidden"></div>
    </div>
    <div id="tab-history" class="hidden">
      <div class="quick-filters">
        <button class="btn-ghost btn-small" data-hquick="today">Today</button>
        <button class="btn-ghost btn-small" data-hquick="yesterday">Yesterday</button>
        <button class="btn-ghost btn-small" data-hquick="week">This week</button>
        <button class="btn-ghost btn-small" data-hquick="month">This month</button>
      </div>
      <div class="filters">
        <input id="hDateFrom" type="date" title="From date">
        <input id="hDateTo" type="date" title="To date">
        <input id="hProduct" placeholder="Product">
        <button class="btn-ghost btn-small" id="hClearBtn">Clear all</button>
      </div>
      <div class="hist-summary" id="histSummary"></div>
      <div id="histList"></div>
      <div class="export-row">
        <span class="hint">Export current results:</span>
        <a href="#" id="exportCsvBtn" class="btn-small btn-ghost" style="text-decoration:none;">CSV</a>
        <a href="#" id="exportXlsxBtn" class="btn-small btn-ghost" style="text-decoration:none;">Excel</a>
        <a href="#" id="exportPdfBtn" class="btn-small btn-ghost" style="text-decoration:none;">PDF</a>
      </div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>
<div class="modal-backdrop hidden" id="issuedModal">
  <div class="modal-sheet">
    <button class="modal-close" id="issuedModalClose">&times;</button>
    <h3 id="issuedModalTitle">Issued breakdown</h3>
    <div id="issuedModalBody"></div>
  </div>
</div>

<!-- Adjust Issued — packaging-aware entry, never a raw base-unit prompt().
     Two steps in one modal: the form (type + Cartons/Packs/Pieces via the
     same qtyInputsHtml()/readQtyInputs() helpers Opening Stock already
     uses — never a second quantity-entry implementation), then a
     required Preview/confirm step before anything is saved. -->
<div class="modal-backdrop hidden" id="adjustModal">
  <div class="modal-sheet">
    <button class="modal-close" id="adjustModalClose">&times;</button>
    <h3 id="adjustModalTitle">Adjust Issued</h3>

<script src="/quantity_format.js"></script>
<script>
let products = [];
let currentIdx = 0;
let sessionValues = {};
let currentUser = null;
// Role-wide Operator Daily-Figures permission flags, fetched once at boot
// (not on every render) — see fetchOperatorPermissions(). Manager/Super
// Admin never consult this; Viewer is never granted anything from it.
let operatorPermissions = {can_edit_opening:false, can_edit_production:false, can_edit_returns:false, can_create_adjustments:false};
// Africa/Kampala date from /api/session — see static/dispatch.html's
// identical variable and todayStr() below.
let businessToday = null;

function todayStr(){ return businessToday || new Date().toISOString().slice(0,10); }
function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- company branding ----------
// Public, unauthenticated endpoint — fetched exactly once per page load
// (never per-interaction), so the login screen and every in-app header
// show the configured company name/logo without hard-coding either.
async function applyBranding(){
  try{
    const res = await fetch('/api/branding');
    const b = await res.json();
    document.querySelectorAll('[data-brand-name]').forEach(el=>{ el.textContent = b.display_name; });
    document.querySelectorAll('[data-brand-logo]').forEach(el=>{
      if(b.logo_url){ el.src = b.logo_url; el.classList.remove('hidden'); }
      else { el.classList.add('hidden'); }
    });
  } catch(e){ /* branding is cosmetic — never block the app over a failed fetch */ }
}
applyBranding();
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

// ---------- API ----------
async function apiGet(path){
  const res = await fetch(path);
  if(res.status===401) return { unauthorized:true };
  return res.json();
}
async function apiPost(path, body){
  const res = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  return {status: res.status, data: await res.json()};
}
async function apiDelete(path, body){
  const res = await fetch(path, {method:"DELETE", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  return {status: res.status, data: await res.json().catch(()=>({}))};
}

async function loadProducts(){
  // Stage 8 Part 2 + final pre-deployment correction: the review/entry
  // wizard walks products in the shared, global quick-selection order
  // (frequency + recency of finalized use) — same endpoint and ranking
  // every operational selector uses, never a separate per-user order —
  // additionally grouped for the CURRENT date+shift so a product that
  // still needs review always sorts ahead of one already completed or
  // marked No Activity, without changing the underlying usage ranking.
  // Re-fetched only on date/shift change (see the change listeners
  // below) — never mid-session, so the list never reorders underneath
  // an Operator who is partway through it.
  const date = document.getElementById('dateInput').value;
  const shift = document.getElementById('shiftInput').value;
  const data = await apiGet(`/api/admin/products?sort=usage&date=${date}&shift=${shift}`);
  products = Array.isArray(data) ? data : [];
}

// ---------- packaging helpers (display-only preview; backend is the source of truth) ----------
// hasPackTier/toBaseUnits/fromBaseUnitsPreview/qtyLabel now live in the
// shared /quantity_format.js (loaded above this script) — one centralized
// formatter, no longer duplicated per page.

function qtyInputsHtml(prefix, rule, vals, readOnly){
  vals = vals || {cartons:0, packs:0, pieces:0};
  const dis = readOnly ? 'disabled' : '';
  const packsField = hasPackTier(rule)
    ? `<div class="qty-field"><label>Packs</label><input type="number" min="0" inputmode="numeric" id="${prefix}Packs" value="${vals.packs||0}" ${dis}></div>`
    : '';
  return `
    <div class="qty-row">
      <div class="qty-field"><label>Cartons</label><input type="number" min="0" inputmode="numeric" id="${prefix}Cartons" value="${vals.cartons||0}" ${dis}></div>
      ${packsField}
      <div class="qty-field"><label>Pieces</label><input type="number" min="0" inputmode="numeric" id="${prefix}Pieces" value="${vals.pieces||0}" ${dis}></div>
    </div>`;
}
function readQtyInputs(prefix, rule){
  const cartons = parseInt(document.getElementById(prefix+'Cartons').value, 10) || 0;
  const packsEl = document.getElementById(prefix+'Packs');
  const packs = hasPackTier(rule) && packsEl ? (parseInt(packsEl.value, 10) || 0) : 0;
  const pieces = parseInt(document.getElementById(prefix+'Pieces').value, 10) || 0;
  return {cartons, packs, pieces};
}
// A quantity field showing exactly "0" clears itself on focus so typing
// starts clean; an empty field reverts to displaying "0" on blur. Reading
// (readQtyInputs, via `|| 0`) already treats a blank field as zero, so
// neither handler needs to touch any stored value — display-only.
function attachZeroClearBehavior(input){
  input.addEventListener('focus', ()=>{
    if(input.value === '0') input.value = '';
  });
  input.addEventListener('blur', ()=>{
    if(input.value.trim() === '') input.value = '0';
  });
}

// ---------- role-based view dispatch ----------
// Server-authoritative: currentUser.role comes from applyUser(user), set
// in boot() from the /api/session response fetched in init() — never a
// value the client can forge. Direct URL access re-runs this same init()
// -> boot() -> renderCurrentView() chain, so an Operator cannot reach the
// elevated per-product card interface by any client-side navigation;
// every write remains independently, fully gated server-side regardless
// (see stock_service.upsert_daily_figure()'s own role/permission checks,
// unchanged by this redesign).
async function renderCurrentView(){
  if(currentUser && currentUser.role === 'operator'){
    document.getElementById('progressWrap').classList.add('hidden');
    document.getElementById('entryCard').classList.add('hidden');
    document.getElementById('doneCard').classList.add('hidden');
    document.getElementById('reviewCard').classList.add('hidden');
    document.getElementById('operatorTable').classList.remove('hidden');
    renderOperatorTable();
  } else {
    document.getElementById('operatorTable').classList.add('hidden');
    document.getElementById('progressWrap').classList.remove('hidden');
    // Daily Figures re-review correction — a Manager/Super Admin landing
    // fresh on a Date+Shift whose review was already submitted must go
    // straight to the review screen (which has its own "Reopen this
    // submitted review" action), not be forced through the per-product
    // wizard first. Walking the wizard on an already-submitted period is
    // exactly how "This review has already been submitted — reopen it
    // first to make changes." used to surface as a dead-end mid-wizard,
    // before the reviewer ever reached the Reopen button. Only checked on
    // a FRESH view (currentIdx===0, set by the date/shift change
    // listeners and boot()) — internal navigation (Return to this
    // product, Back to products, Save & Advance) calls renderEntryCard()
    // directly and is never affected.
    const isElevated = currentUser && ['super_admin','manager'].includes(currentUser.role);
    if(isElevated && currentIdx === 0){
      const date = document.getElementById('dateInput').value;
      const shift = document.getElementById('shiftInput').value;
      const summary = await apiGet(`/api/daily-review?date=${date}&shift=${shift}`);
      if(summary && summary.session && summary.session.status === 'submitted'){
        showReviewScreen(date, shift);
        return;
      }
    }
    renderEntryCard();
  }
}

// ---------- Operator Daily Figures redesign: simple read-only table ----------
// One batched, authoritative request (GET /api/daily-figures/operator-
// summary) backs the entire table — never one request per product, never
// a client-side recalculation of Opening/Closing (every value here is
// exactly what the server's stock_service.daily_figure_view() computed,
// the same function Daily Figures/Dashboard/History/Exports/Reset/the
// stock-ledger CLI all already share). The frontend only formats and
// filters for display; it never derives a number.
async function renderOperatorTable(){
  const date = document.getElementById('dateInput').value;
  const shift = document.getElementById('shiftInput').value;
  const container = document.getElementById('operatorTable');
  container.innerHTML = '<p class="op-note">Loading…</p>';

  // Deliberately NOT the shared apiGet() helper here — apiGet() only
  // special-cases 401 and otherwise always resolves (even for a 4xx/5xx
  // response), so a genuine server error previously only surfaced as an
  // uncaught JSON-parse exception (an HTML error page isn't valid JSON).
  // This local fetch checks the real HTTP status explicitly, so a clean
  // JSON error response from the server (see operator_summary()'s own
  // try/except) is shown correctly, and an empty, healthy 200 response
  // (no activity yet) is never mistaken for a failure.
  let data;
  try{
    const res = await fetch(`/api/daily-figures/operator-summary?date=${date}&shift=${shift}`);
    const body = await res.json().catch(() => null);
    if(!res.ok || !body || !Array.isArray(body.products)){
      container.innerHTML = `<p class="op-note">${escapeHtml((body && body.error) || 'Could not load Daily Figures for this period. Please try again.')}</p>`;
      return;
    }
    data = body;
  } catch(e){
    // A genuine network failure (fetch itself rejected) — the only case
    // this outer catch is still needed for.
    container.innerHTML = '<p class="op-note">Could not load Daily Figures for this period. Please try again.</p>';
    return;
  }

  if(!data.products.length){
    // Only reachable when the product catalogue itself is empty.
    container.innerHTML = `
      <div class="op-empty">
        <p>No products are configured yet.</p>
      </div>`;
    return;
  }

  container.innerHTML = _operatorTableHtml(data.products);
}

function _operatorTableHtml(products){
  const rows = products.map(r => {
    const closingNegative = !!(r.closing && r.closing.base_qty < 0);
    return `
      <tr>
        <td>${escapeHtml(r.product_name)}</td>
        <td>${qtyLabel(r.opening, r.packaging_rule)}</td>
        <td>${qtyLabel(r.production, r.packaging_rule)}</td>
        <td>${qtyLabel(r.return_, r.packaging_rule)}</td>
        <td>${qtyLabel(r.issued, r.packaging_rule)}</td>
        <td class="op-closing${closingNegative ? ' op-negative' : ''}">${qtyLabel(r.closing, r.packaging_rule)}</td>
      </tr>`;
  }).join('');
  return `
    <p class="op-swipe-hint">Swipe horizontally to view all figures.</p>
    <div class="op-table-wrap">
      <table class="op-table">
        <thead><tr><th>Product</th><th>Opening Stock</th><th>Production</th><th>Returns</th><th>Issued</th><th>Closing Stock</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

// ---------- entry wizard ----------
async function renderEntryCard(){
  const date = document.getElementById('dateInput').value;
  const shift = document.getElementById('shiftInput').value;
  const role = currentUser && currentUser.role;
  const isElevated = role === 'super_admin' || role === 'manager';

  document.getElementById('doneCard').classList.add('hidden');
  document.getElementById('reviewCard').classList.add('hidden');
  document.getElementById('entryCard').classList.remove('hidden');
  document.getElementById('progressWrap').classList.remove('hidden');

  // Final pre-deployment correction: reaching the end of the product list
  // is navigation, never submission — for Manager/Super Administrator it
  // opens the final review screen (nothing is marked submitted merely by
  // arriving there); Operator/Viewer keep the existing "done" card
  // unchanged.
  if(currentIdx >= products.length){
    if(isElevated){ showReviewScreen(date, shift); } else { showDone(date, shift); }
    return;
  }

  const product = products[currentIdx];
  document.getElementById('progressFill').style.width = ((currentIdx)/products.length*100)+'%';
  document.getElementById('progressLabel').textContent = (currentIdx+1)+' / '+products.length;

  const card = document.getElementById('entryCard');

  if(!product.packaging_rule){
    card.innerHTML = `
      <div class="card">
        <p class="product-sub">Product ${currentIdx+1} of ${products.length} · ${shift} shift, ${date}</p>
        <p class="product-name">${product.name}</p>
        <div class="not-configured">No packaging rule configured for this product yet.<br>Set one in Admin &gt; Products.</div>
        <div class="nav-row">
          ${currentIdx>0 ? `<button class="btn btn-ghost" id="backBtn">Back</button>` : ''}
          <button class="btn btn-primary" id="skipBtn">Skip &amp; continue</button>
        </div>
      </div>`;
    document.getElementById('skipBtn').addEventListener('click', ()=>{ currentIdx++; renderEntryCard(); });
    const backBtn = document.getElementById('backBtn');
    if(backBtn) backBtn.addEventListener('click', ()=>{ currentIdx--; renderEntryCard(); });
    return;
  }

  const view = await apiGet(`/api/daily-figures/${product.id}?date=${date}&shift=${shift}`);
  const rule = view.packaging_rule;

  const isViewer = role === 'viewer';
  // Accountant is a read-only-plus-Requests role, same as Viewer for
  // every operational Daily Figures action — never editable, never able
  // to mark No Activity (backend also refuses both server-side; see
  // webapp/routes/daily_entry_status.py and daily_figures.py's role
  // gates, which never included accountant in the first place).
  const isAccountant = role === 'accountant';

  // Ownership/completion (Stage 7 section 1): an Operator asking for this
  // entry actually acquires the lock (or learns it's contested/completed)
  // in the same request; every other role just reads the current status
  // without claiming anything, since Manager/Super Admin correction
  // authority (section 3) never needs to own a lock, and Viewer never
  // writes at all.
  const entryStatus = await fetchEntryStatus(product, date, shift);
  const isCompleted = entryStatus.status === 'completed';
  const blockedByOther = !!entryStatus.locked_by && (!currentUser || entryStatus.locked_by !== currentUser.username);

  // Manager/Super Admin: always editable, never blocked by another user's
  // lock or a prior completion (unchanged). Operator: gated by the
  // role-wide permission flag AND by ownership — someone else's live lock
  // or an existing completion takes precedence. Viewer: never editable.
  const canEditOpening = isElevated || (role === 'operator' && operatorPermissions.can_edit_opening && !isCompleted && !blockedByOther);
  const canAdjust = isElevated || (role === 'operator' && operatorPermissions.can_create_adjustments && !isCompleted && !blockedByOther);
  // Opening Stock (only on a product's first-ever period) is the only
  // quantity Daily Figures still accepts directly — Return and Production
  // are entered in the Returns Book / Production Book and shown here
  // read-only, exactly like Issued already was. So there is nothing left
  // to save unless this is that first-ever entry and the current role is
  // allowed to set it. Stage 8 section 3: Manager/Super Admin may ALSO
  // correct Opening Stock on a later, normally-derived period — their own
  // explicit value becomes a new carry-forward anchor (see
  // stock_service.upsert_daily_figure()) — so the input shows for them
  // regardless of view.opening_editable.
  const showOpeningInputs = view.opening_editable || isElevated;
  const isFullyReadOnly = isViewer || isAccountant || !(showOpeningInputs && canEditOpening);
  // No Activity Today is available to anyone who could otherwise act on
  // this entry, whether or not Opening Stock itself happens to be
  // editable right now — see Stage 7 section 6.
  const canMarkNoActivity = !isViewer && !isAccountant && !isCompleted && !blockedByOther;

  card.innerHTML = `
    <div class="card">
      <p class="product-sub">Product ${currentIdx+1} of ${products.length} · ${shift} shift, ${date}</p>
      <p class="product-name">${product.name}</p>
      ${renderStatusBanner(entryStatus, isCompleted, blockedByOther, isElevated)}
      <div class="stock-readout">
        <span class="lbl">Opening Stock</span>
        <span class="val qty-readout" id="openingReadout">${qtyLabel(view.opening, rule)}</span>
      </div>
      ${showOpeningInputs ? `<div style="margin-bottom:14px;">${qtyInputsHtml('opening', rule, view.opening, !canEditOpening)}</div>` : ''}
      <div class="stock-readout mt">
        <span class="lbl">Returns <span class="hint" style="font-weight:400;text-transform:none;">(auto)</span></span>
        <span class="val qty-readout">${qtyLabel(view.return_, rule)}</span>
      </div>

      <div class="stock-readout mt">
        <span class="lbl">Production <span class="hint" style="font-weight:400;text-transform:none;">(auto)</span></span>
        <span class="val qty-readout">${qtyLabel(view.production, rule)}</span>
      </div>

      <div class="stock-readout mt">
        <span class="lbl">Issued <span class="hint" style="font-weight:400;text-transform:none;">(auto)</span></span>
        <span>
          <span class="val qty-readout">${qtyLabel(view.issued, rule)}</span>
          <button class="issued-link" id="issuedBreakdownBtn">view</button>
          ${canAdjust ? `<button class="adjust-link" id="adjustIssuedBtn">adjust</button>` : ''}
        </span>
      </div>

      <div class="closing-readout"><span class="lbl">Closing Stock</span><span class="val" id="closingPreview">—</span></div>
      <div class="nav-row">
        ${isFullyReadOnly ? `
          ${currentIdx>0 ? `<button class="btn btn-ghost" id="prevProductBtn">Previous Product</button>` : ''}
          ${currentIdx<products.length-1 ? `<button class="btn btn-primary" id="nextProductBtn">Next Product</button>` : ''}
        ` : isElevated ? `
          ${currentIdx>0 ? `<button class="btn btn-ghost" id="prevProductBtn">Previous Product</button>` : ''}
          <button class="btn btn-primary" id="reviewNextBtn">${currentIdx<products.length-1 ? 'Next Product' : 'Review Daily Figures'}</button>
        ` : `
          ${currentIdx>0 ? `<button class="btn btn-ghost" id="prevProductBtn">Previous Product</button>` : ''}
          <button class="btn btn-primary" id="saveNextBtn">Save &amp; Next</button>
        `}
      </div>
      ${canMarkNoActivity ? `<button class="btn-no-activity" id="noActivityBtn">No Activity Today</button>` : ''}
      ${isFullyReadOnly ? '' : (isElevated
        ? `<button class="btn-skip-review" id="skipReviewBtn">Skip to Submit</button>`
        : `<button class="btn-skip" id="skipBtn">Skip for now — leave this product unreviewed and come back later</button>`)}
    </div>
  `;

  function updatePreview(){
    const o = showOpeningInputs ? toBaseUnits(...Object.values(readQtyInputs('opening', rule)), rule) : view.opening.base_qty;
    const closingBase = o + view.return_.base_qty + view.production.base_qty - view.issued.base_qty;
    const el = document.getElementById('closingPreview');
    // Final legacy-migration investigation, section 9 — a negative
    // preview is fully expressible in book notation (one leading minus
    // sign on the correctly-split magnitude), never a text warning
    // replacing the number — matches every other surface exactly.
    el.textContent = qtyLabel(fromBaseUnitsPreview(closingBase, rule), rule);
  }
  card.querySelectorAll('input').forEach(el=>{
    el.addEventListener('input', updatePreview);
    attachZeroClearBehavior(el);
  });
  updatePreview();

  document.getElementById('issuedBreakdownBtn').addEventListener('click', ()=>openIssuedBreakdown(product, date, shift));
  const adjustBtn = document.getElementById('adjustIssuedBtn');
  if(adjustBtn) adjustBtn.addEventListener('click', ()=>adjustIssued(product, date, shift));

  // Editable workflow (Save & Next / Skip) — only ever reachable for a
  // product's first-ever entry (Opening Stock). Neither element exists in
  // the DOM when isFullyReadOnly, so there is nothing to wire up and no
  // path that could ever call saveCurrentAndAdvance().
  const saveNextBtn = document.getElementById('saveNextBtn');
  if(saveNextBtn) saveNextBtn.addEventListener('click', ()=>saveCurrentAndAdvance(product, date, shift, rule, view, showOpeningInputs));
  const skipBtn = document.getElementById('skipBtn');
  if(skipBtn) skipBtn.addEventListener('click', ()=>{ releaseLockIfOwned(product, date, shift); currentIdx++; renderEntryCard(); });
  // Manager/Super Administrator review workflow — "Next Product"/"Review
  // Daily Figures" saves (review_mode: true, never claims per-product
  // completion) and records review progress; "Skip for now" records the
  // product as skipped and never saves anything.
  const reviewNextBtn = document.getElementById('reviewNextBtn');
  if(reviewNextBtn) reviewNextBtn.addEventListener('click', ()=>saveAndAdvanceReview(product, date, shift, rule, view, showOpeningInputs));
  const skipReviewBtn = document.getElementById('skipReviewBtn');
  if(skipReviewBtn) skipReviewBtn.addEventListener('click', ()=>skipAndAdvanceReview(product, date, shift));
  const noActivityBtn = document.getElementById('noActivityBtn');
  if(noActivityBtn) noActivityBtn.addEventListener('click', ()=>markNoActivity(product, date, shift));
  const takeoverBtn = document.getElementById('takeoverLockBtn');
  if(takeoverBtn) takeoverBtn.addEventListener('click', ()=>takeoverLock(product, date, shift));
  const reopenBtn = document.getElementById('reopenEntryBtn');
  if(reopenBtn) reopenBtn.addEventListener('click', ()=>reopenEntry(product, date, shift));

  // Previous Product — same id/handler in both the read-only and editable
  // branches (only one is ever in the DOM at a time). Pure product-index
  // movement, never a network request of any kind, in both cases. For an
  // editable user specifically, it warns before discarding unsaved typed
  // changes rather than silently dropping them.
  const prevProductBtn = document.getElementById('prevProductBtn');
  if(prevProductBtn) prevProductBtn.addEventListener('click', ()=>{
    if(!isFullyReadOnly && hasUnsavedChanges(rule, view, showOpeningInputs)){
      if(!confirm('You have unsaved changes for this product. Leave without saving?')) return;
    }
    releaseLockIfOwned(product, date, shift);
    currentIdx--; renderEntryCard();
  });
  // Next Product — read-only review navigation only; hidden on the last
  // product (see the nav-row markup above) rather than looping past it.
  const nextProductBtn = document.getElementById('nextProductBtn');
  if(nextProductBtn) nextProductBtn.addEventListener('click', ()=>{ releaseLockIfOwned(product, date, shift); currentIdx++; renderEntryCard(); });
}

// ---------- daily entry ownership/completion (Stage 7) ----------
// An Operator's request both reads AND claims the lock in one call — every
// other role only ever reads the current status (Manager/Super Admin
// correction authority bypasses ownership locking server-side regardless;
// Viewer never writes). See webapp/services/daily_entry_status_service.py.
async function fetchEntryStatus(product, date, shift){
  if(currentUser && currentUser.role === 'operator'){
    const {status, data} = await apiPost('/api/daily-entry-status/lock', {product_id: product.id, date, shift});
    if(status === 409){
      const fresh = await apiGet(`/api/daily-entry-status?date=${date}&shift=${shift}&product_id=${product.id}`);
      return fresh;
    }
    return data;
  }
  return await apiGet(`/api/daily-entry-status?date=${date}&shift=${shift}&product_id=${product.id}`);
}
function releaseLockIfOwned(product, date, shift){
  if(!currentUser || currentUser.role !== 'operator') return;
  // Fire-and-forget — leaving the product early shouldn't block on a
  // network round trip, and a lock nobody renews naturally expires anyway.
  apiDelete('/api/daily-entry-status/lock', {product_id: product.id, date, shift}).catch(()=>{});
}
// Explicitly Africa/Kampala, never the viewer's own device timezone — a
// user opening this app from a different timezone must still see the
// company's own Kampala business time for these entry/review timestamps.
function formatEntryTime(iso){
  if(!iso) return '';
  return new Date(iso + 'Z').toLocaleString(undefined, {timeZone:'Africa/Kampala', day:'numeric', month:'short', year:'numeric', hour:'numeric', minute:'2-digit'});
}
function renderStatusBanner(entryStatus, isCompleted, blockedByOther, isElevated){
  if(isCompleted){
    const who = entryStatus.completed_by || 'another user';
    const when = formatEntryTime(entryStatus.completed_at);
    const message = entryStatus.completion_type === 'no_activity'
      ? `No Activity Today recorded by ${escapeHtml(who)}${when ? ' at ' + when : ''}.`
      : `Already inputted by ${escapeHtml(who)}${when ? ' at ' + when : ''}.`;
    return `<div class="status-banner info"><span>${message}</span>${isElevated ? `<button id="reopenEntryBtn">Reopen</button>` : ''}</div>`;
  }
  if(blockedByOther){
    const who = escapeHtml(entryStatus.locked_by || 'another user');
    return `<div class="status-banner warn"><span>This product is currently being entered by ${who}.</span>${isElevated ? `<button id="takeoverLockBtn">Take over</button>` : ''}</div>`;
  }
  return '';
}

function hasUnsavedChanges(rule, view, showOpeningInputs){
  // Opening Stock is the only editable field left on this card — Return
  // and Production are always read-only readouts now (sourced from their
  // own Books), so there is nothing else that could ever have an unsaved
  // change. showOpeningInputs also covers a Manager/Super Admin correcting
  // an otherwise-derived period (Stage 8 section 3).
  if(!showOpeningInputs) return false;
  const differs = (current, saved) => {
    saved = saved || {cartons: 0, packs: 0, pieces: 0};
    return current.cartons !== (saved.cartons || 0) || current.packs !== (saved.packs || 0) || current.pieces !== (saved.pieces || 0);
  };
  return differs(readQtyInputs('opening', rule), view.opening);
}

async function saveCurrentAndAdvance(product, date, shift, rule, view, showOpeningInputs){
  const opening = showOpeningInputs ? readQtyInputs('opening', rule) : null;

  // Final reset-safety correction, section 4 — Opening Stock only becomes
  // an authoritative manual_correction when the user actually TYPED a
  // different value into an already-derived period (never for the
  // genuine first-ever-period entry, which view.opening_editable already
  // distinguishes — see the "Correcting this becomes a new stock-balance
  // anchor" hint just above this field). A routine save/navigation with
  // nothing changed sends no explicit-edit intent at all, exactly like
  // every other action on this page (notes, status, No Activity, review).
  const isCorrection = showOpeningInputs && !view.opening_editable && hasUnsavedChanges(rule, view, showOpeningInputs);
  let openingCorrectionReason = null;
  if(isCorrection){
    openingCorrectionReason = prompt('Reason for this Opening Stock correction (required):');
    if(!openingCorrectionReason){
      toast('A reason is required to correct Opening Stock — change was not saved');
      return;
    }
  }

  const {status, data} = await apiPost('/api/daily-figures', {
    product_id: product.id, date, shift, opening,
    opening_stock_explicitly_edited: isCorrection,
    opening_correction_reason: openingCorrectionReason,
  });
  if(status !== 200){
    toast(data.error || 'Could not save — check the values');
    if(status === 409) renderEntryCard(); // reflect who actually holds/completed it now
    return;
  }
  currentIdx++;
  renderEntryCard();
}

// ---------- Manager/Super Administrator review-and-submit workflow ----------
// "Next Product"/"Review Daily Figures": saves a genuine Opening Stock
// correction if one was typed (review_mode: true so it never silently
// claims per-product completion — see webapp/routes/daily_figures.py),
// then records this product as reviewed (or edited) in the review
// session before advancing. Navigation and temporary edits are never
// treated as final submission — only the review screen's own explicit
// "Submit Daily Figures Review" button can do that.
async function saveAndAdvanceReview(product, date, shift, rule, view, showOpeningInputs){
  const edited = showOpeningInputs && hasUnsavedChanges(rule, view, showOpeningInputs);
  let reason = null;
  if(edited){
    // Final reset-safety correction, section 4/6 — the backend now
    // requires a reason WITH the Opening Stock correction itself (an
    // explicit-edit-intent save), not deferred until review submission
    // as before. Declining is still fine — the edit is simply not saved,
    // and the reviewer can return to this product later.
    reason = prompt('Reason for this correction (required):');
    if(!reason){
      toast('A reason is required to correct Opening Stock — change was not saved');
      return;
    }
    const opening = readQtyInputs('opening', rule);
    const {status, data} = await apiPost('/api/daily-figures', {
      product_id: product.id, date, shift, opening, review_mode: true,
      opening_stock_explicitly_edited: true,
      opening_correction_reason: reason,
    });
    if(status !== 200){
      toast(data.error || 'Could not save — check the values');
      if(status === 409) renderEntryCard();
      return;
    }
  }
  const {status: rStatus, data: rData} = await apiPost('/api/daily-review/mark-reviewed', {
    date, shift, product_id: product.id, edited, reason,
  });
  if(rStatus !== 200){
    toast(rData.error || 'Could not record review progress');
    return;
  }
  currentIdx++;
  renderEntryCard();
}

// "Skip to Submit" — Manager/Super Admin review workflow only. Marks the
// CURRENT product skipped (same /api/daily-review/mark-skipped call as
// before — no stock movement, no zeros inserted, no fabricated review;
// mirrors exactly what a plain "Skip" already did to this one product)
// and then jumps straight to the Submit/Review screen instead of
// advancing to the next unreviewed product — the whole point being to
// avoid stepping through every remaining product with no activity.
// Every OTHER still-unreviewed product is simply left as "not yet
// reviewed", exactly as if the reviewer had never visited it — nothing
// is skipped, zeroed, or marked reviewed on their behalf. Back/Next from
// the review screen (or "Return to this product") still works normally
// for a reviewer who wants to go through the rest individually.
async function skipAndAdvanceReview(product, date, shift){
  const {status, data} = await apiPost('/api/daily-review/mark-skipped', {date, shift, product_id: product.id});
  if(status !== 200){ toast(data.error || 'Could not skip this product'); return; }
  showReviewScreen(date, shift);
}

async function showReviewScreen(date, shift){
  document.getElementById('entryCard').classList.add('hidden');
  document.getElementById('doneCard').classList.add('hidden');
  document.getElementById('progressWrap').classList.add('hidden');
  const reviewCard = document.getElementById('reviewCard');
  reviewCard.classList.remove('hidden');
  reviewCard.innerHTML = '<div class="card"><p class="hint">Loading review…</p></div>';

  const summary = await apiGet(`/api/daily-review?date=${date}&shift=${shift}`);
  if(summary.unauthorized){ reviewCard.innerHTML = '<div class="card"><p>Session expired — sign in again.</p></div>'; return; }

  const session = summary.session;
  const submitted = session && session.status === 'submitted';

  const stateLabel = (row) => {
    if(row.source_changed_since_review) return 'Source record changed — needs re-review';
    if(row.daily_figure_changed_since_review) return 'Daily record changed — needs re-review';
    if(row.locked_by) return `Locked by ${row.locked_by}`;
    if(row.validation_error) return 'Validation error';
    if(row.missing_correction_reason) return 'Correction reason required';
    if(row.review_state === 'reviewed') return 'Reviewed — unchanged';
    if(row.review_state === 'edited') return 'Edited';
    if(row.review_state === 'skipped') return 'Skipped for now';
    return 'Not yet reviewed';
  };
  const stateClass = (row) => {
    if(row.locked_by || row.validation_error || row.source_changed_since_review || row.daily_figure_changed_since_review || row.missing_correction_reason) return 'review-state-blocked';
    if(row.review_state === 'skipped') return 'review-state-skipped';
    if(row.review_state === 'reviewed' || row.review_state === 'edited') return `review-state-${row.review_state}`;
    return 'review-state-not_reviewed';
  };

  const rows = summary.products.map((row, idx) => {
    const view = row.view;
    const figures = view
      ? `Opening ${qtyLabel(view.opening, view.packaging_rule)} · Production ${qtyLabel(view.production, view.packaging_rule)} · Returns ${qtyLabel(view.return_, view.packaging_rule)} · Issued ${qtyLabel(view.issued, view.packaging_rule)} · Closing ${qtyLabel(view.closing, view.packaging_rule)}`
      : (row.validation_error || '');
    let attribution = '';
    if(row.completed_by) attribution += `Entered by ${escapeHtml(row.completed_by)}${row.completed_at ? ' at ' + escapeHtml(formatEntryTime(row.completed_at)) : ''}. `;
    if(row.source_changed_since_review || row.daily_figure_changed_since_review) attribution += 'This product changed while you were reviewing it. Reload the current figures before submitting.';
    return `
      <div class="review-row">
        <span class="name">${escapeHtml(row.product_name)}</span>
        <span class="state ${stateClass(row)}">${escapeHtml(stateLabel(row))}</span>
        <div class="figures">${figures}</div>
        ${attribution ? `<div class="attribution">${attribution}</div>` : ''}
        <div><button class="goto" data-goto-product="${idx}">Return to this product</button></div>
      </div>`;
  }).join('');

  const dateLabel = new Date(date + 'T00:00:00').toLocaleDateString('en-US', {day:'numeric', month:'long', year:'numeric'});

  reviewCard.innerHTML = `
    <div class="card">
      <h2>Daily Figures review — ${escapeHtml(shift)}, ${escapeHtml(date)}</h2>
      ${submitted
        ? `<p class="hint">Daily Figures review submitted by ${escapeHtml(session.submitted_by_username || '')} at ${escapeHtml(session.submitted_at ? formatEntryTime(session.submitted_at) : '')}.</p>`
        : `<p class="hint">Review in progress — nothing is submitted until you explicitly confirm below.</p>`}
      <div class="review-summary">
        <div class="stat"><div class="n">${summary.reviewed_count} / ${summary.total}</div><div class="l">reviewed</div></div>
        <div class="stat"><div class="n">${summary.skipped_count}</div><div class="l">skipped for later</div></div>
        <div class="stat"><div class="n">${summary.blocking_count}</div><div class="l">need attention</div></div>
      </div>
      ${rows}
      <div class="msg" id="reviewSubmitMsg"></div>
      ${submitted ? `
        <button class="btn btn-ghost" id="reopenReviewBtn" style="width:100%;">Reopen this submitted review</button>
      ` : `
        ${summary.blocking_count > 0 ? `<p class="hint" style="color:var(--red);">${summary.blocking_count} product(s) still require review before submission.</p>` : ''}
        ${summary.blocking_count === 0 && summary.unreviewed_count > 0 ? `<p class="hint">${summary.unreviewed_count} product(s) have not been reviewed — you can still submit; you'll be asked to confirm.</p>` : ''}
        <button class="btn btn-primary" id="submitReviewBtn" style="width:100%;" ${summary.blocking_count > 0 || summary.total === 0 ? 'disabled' : ''}>Submit Daily Figures Review</button>
      `}
      <button class="btn btn-ghost" id="reviewBackBtn" style="width:100%;margin-top:8px;">Back to products</button>
    </div>`;

  reviewCard.querySelectorAll('[data-goto-product]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ currentIdx = parseInt(btn.dataset.gotoProduct, 10); renderEntryCard(); });
  });
  document.getElementById('reviewBackBtn').addEventListener('click', ()=>{ currentIdx = 0; renderEntryCard(); });

  // Manager/Super Admin may submit with unreviewed products still
  // outstanding — never silently, always via an explicit "Submit
  // anyway?" confirmation (Cancel returns to review, nothing is sent).
  // Genuine hard blockers (locks/validation errors/missing correction
  // reasons/staleness — summary.blocking_count) are never bypassable by
  // this or any confirmation; the button itself stays disabled for those
  // regardless. Unreviewed products are never auto-zeroed, auto-
  // reviewed, or otherwise touched by submitting past them — see
  // daily_review_service.submit_review()'s own docstring.
  const submitBtn = document.getElementById('submitReviewBtn');
  if(submitBtn) submitBtn.addEventListener('click', async ()=>{
    const msg = document.getElementById('reviewSubmitMsg');
    if(!confirm(`Submit the Daily Figures review for ${dateLabel} — ${shift}?`)) return;
    let force = false;
    if(summary.unreviewed_count > 0){
      if(!confirm(`${summary.unreviewed_count} product(s) have not been reviewed. Submit anyway?`)) return;
      force = true;
    }
    let {status, data} = await apiPost('/api/daily-review/submit', {date, shift, force});
    if(status === 409 && data.requires_confirmation){
      // The count changed since this screen loaded (another reviewer's
      // session, or a stale page) — ask again with the current number
      // rather than silently forcing or silently failing.
      if(!confirm(data.error)) return;
      ({status, data} = await apiPost('/api/daily-review/submit', {date, shift, force: true}));
    }
    if(status !== 200){ msg.textContent = data.error || 'Could not submit review.'; msg.className = 'msg err'; return; }
    toast('Daily Figures review submitted.');
    showReviewScreen(date, shift);
  });

  const reopenBtn = document.getElementById('reopenReviewBtn');
  if(reopenBtn) reopenBtn.addEventListener('click', async ()=>{
    const reason = prompt('Reason to reopen this submitted review:');
    if(!reason) return;
    const {status, data} = await apiPost('/api/daily-review/reopen', {date, shift, reason});
    if(status !== 200){ toast(data.error || 'Could not reopen review.'); return; }
    toast('Review reopened.');
    showReviewScreen(date, shift);
  });
}

// ---------- issued drill-down & adjustments ----------
// The current product/date/shift the Issued breakdown modal is open
// for — set once per openIssuedBreakdown() call, read by the per-row
// Delete handler and by adjustIssued()/the confirm-save handler below so
// none of them need their own copy of these three values.
let issuedBreakdownContext = null;

async function openIssuedBreakdown(product, date, shift){
  issuedBreakdownContext = {product, date, shift};
  const detail = await apiGet(`/api/daily-figures/issued-detail?product_id=${product.id}&date=${date}&shift=${shift}`);
  document.getElementById('issuedModalTitle').textContent = `${product.name} — Issued, ${date} ${shift}`;
  const body = document.getElementById('issuedModalBody');
  const isElevated = currentUser && ['super_admin','manager'].includes(currentUser.role);
  const dispatchRows = (detail.dispatches||[]).map(d => `
    <div class="contrib-row">
      <div>
        <div><a href="/dispatch.html?customer_id=${d.customer_id||''}&customer_name=${encodeURIComponent(d.customer_name||'')}" style="color:var(--ink);text-decoration:underline;">${escapeHtml(d.customer_name||'—')}</a>${d.sales_category_name ? ` · <a href="/dispatch.html?sales_category_id=${d.sales_category_id||''}" style="color:var(--ink-soft);text-decoration:underline;font-size:11px;">${escapeHtml(d.sales_category_name)}</a>` : ''}</div>
        <div class="meta"><a href="/dispatch.html?dispatch_number=${encodeURIComponent(d.dispatch_number)}" style="color:var(--teal-dark);">Dispatch #${d.dispatch_number} &rarr;</a></div>
      </div>
      <div class="qty-readout">${qtyLabel(d, product.packaging_rule)}</div>
    </div>`).join('');
  // Adjustment rows — formatted through the SAME centralized packaging-
  // aware formatter the dispatch rows above use (fromBaseUnitsPreview()
  // + qtyLabel()), never the raw delta_base_qty integer. A "+"/"-" prefix
  // still signals direction (matching the sign convention documented on
  // StockAdjustment.delta_base_qty), but the magnitude is always shown in
  // the product's own book notation, never labelled "Ctns" while actually
  // being unconverted base units.
  const adjustmentRows = (detail.adjustments||[]).map(a => {
    const split = fromBaseUnitsPreview(Math.abs(a.delta_base_qty), product.packaging_rule);
    const sign = a.delta_base_qty > 0 ? '+' : '-';
    return `
    <div class="contrib-row">
      <div>
        <div>Adjustment</div>
        <div class="meta">${escapeHtml(a.reason)}</div>
        ${isElevated ? `<button class="del" data-delete-adjustment="${a.id}">Delete adjustment</button>` : ''}
      </div>
      <div class="qty-readout">${sign}${qtyLabel(split, product.packaging_rule)}</div>
    </div>`;
  }).join('');
  body.innerHTML = (dispatchRows||'') + (adjustmentRows||'') ||
    '<p class="hint">No finalized dispatches or adjustments contribute to this total.</p>';
  document.getElementById('issuedModal').classList.remove('hidden');

  body.querySelectorAll('[data-delete-adjustment]').forEach(btn=>{
    btn.addEventListener('click', ()=>deleteAdjustment(parseInt(btn.dataset.deleteAdjustment, 10)));
  });
}
