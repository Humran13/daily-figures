  document.getElementById('issuedModal').classList.add('hidden');
});

// ---------- delete an erroneous adjustment (Manager/Super Admin only) ----------
// Permanent hard delete — same pattern as Dispatch/Returns/Production
// permanent delete elsewhere in this app: reason required, explicit
// confirmation required, full audit snapshot taken server-side before
// removal, and the row is simply gone afterwards — every live Issued
// calculation already reads StockAdjustment straight from the database,
// so removal alone corrects Issued/Closing exactly once. Never a
// compensating fake adjustment.
async function deleteAdjustment(adjustmentId){
  const reason = prompt('Reason for permanently deleting this adjustment (required, will be audited):');
  if(!reason || !reason.trim()) return;
  if(!confirm('Delete this stock adjustment permanently? This cannot be undone.')) return;

  const {status, data} = await apiDelete(`/api/daily-figures/adjustments/${adjustmentId}`, {reason: reason.trim(), confirm: true});
  if(status !== 200){ toast(data.error || 'Could not delete adjustment'); return; }
  toast('Adjustment deleted.');
  document.getElementById('issuedModal').classList.add('hidden');
  if(issuedBreakdownContext) renderEntryCard();
}

// ---------- adjust Issued — packaging-aware entry (never a raw base-unit prompt) ----------
let adjustContext = null;

function adjustIssued(product, date, shift){
  adjustContext = {product, date, shift};
  const rule = product.packaging_rule;
  document.getElementById('adjustModalTitle').textContent = `Adjust Issued — ${product.name}`;
  document.getElementById('adjustType').value = 'increase';
  document.getElementById('adjustQtyInputs').innerHTML = qtyInputsHtml('adj', rule, {cartons:0, packs:0, pieces:0}, false);
  document.getElementById('adjustQtyInputs').querySelectorAll('input').forEach(attachZeroClearBehavior);
  document.getElementById('adjustReason').value = '';
  document.getElementById('adjustMsg').textContent = '';
  document.getElementById('adjustFormPanel').classList.remove('hidden');
  document.getElementById('adjustConfirmPanel').classList.add('hidden');
  document.getElementById('adjustModal').classList.remove('hidden');
}
document.getElementById('adjustModalClose').addEventListener('click', ()=>{
  document.getElementById('adjustModal').classList.add('hidden');
});
document.getElementById('adjustCancelBtn').addEventListener('click', ()=>{
  document.getElementById('adjustModal').classList.add('hidden');
});

document.getElementById('adjustPreviewBtn').addEventListener('click', ()=>{
  const msg = document.getElementById('adjustMsg');
  const reason = document.getElementById('adjustReason').value.trim();
  if(!reason){ msg.textContent = 'A reason is required.'; msg.className = 'msg err'; return; }
  const rule = adjustContext.product.packaging_rule;
  const qty = readQtyInputs('adj', rule);
  // Packs must stay within this product's own tier (e.g. 0-5 for Napkins'
  // 6-packs-per-carton rule) — never silently rolled over here the way
  // build_line()/normalize() would for a Dispatch/Return/Production line;
  // an adjustment has no such normalization step, so an out-of-range
  // pack digit is rejected outright rather than quietly reinterpreted.
  if(hasPackTier(rule) && qty.packs >= rule.cartons_to_packs){
    msg.textContent = `Packs must be between 0 and ${rule.cartons_to_packs - 1} for this product.`;
    msg.className = 'msg err';
    return;
  }
  if(!hasPackTier(rule) && qty.pieces >= rule.carton_to_pieces){
    msg.textContent = `Pieces must be between 0 and ${rule.carton_to_pieces - 1} for this product.`;
    msg.className = 'msg err';
    return;
  }
  if(hasPackTier(rule) && qty.pieces >= rule.packs_to_pieces){
    msg.textContent = `Pieces must be between 0 and ${rule.packs_to_pieces - 1} for this product.`;
    msg.className = 'msg err';
    return;
  }
  const baseUnits = toBaseUnits(qty.cartons, qty.packs, qty.pieces, rule);
  if(baseUnits === 0){ msg.textContent = 'Enter a non-zero quantity.'; msg.className = 'msg err'; return; }
  msg.textContent = '';

  const type = document.getElementById('adjustType').value; // 'increase' | 'reduce'
  const signedBase = type === 'reduce' ? -baseUnits : baseUnits;

  document.getElementById('confProduct').textContent = adjustContext.product.name;
  document.getElementById('confType').textContent = type === 'reduce' ? 'Reduce Issued' : 'Increase Issued';
  document.getElementById('confQty').textContent = qtyLabel(qty, rule);
  document.getElementById('confBase').textContent = `${signedBase > 0 ? '+' : ''}${signedBase}`;
  document.getElementById('confReason').textContent = reason;
  document.getElementById('adjustConfirmPanel').dataset.signedBase = String(signedBase);
  document.getElementById('adjustConfirmMsg').textContent = '';

  document.getElementById('adjustFormPanel').classList.add('hidden');
  document.getElementById('adjustConfirmPanel').classList.remove('hidden');
});

document.getElementById('adjustConfirmBackBtn').addEventListener('click', ()=>{
  document.getElementById('adjustConfirmPanel').classList.add('hidden');
  document.getElementById('adjustFormPanel').classList.remove('hidden');
});

document.getElementById('adjustConfirmSaveBtn').addEventListener('click', async ()=>{
  const {product, date, shift} = adjustContext;
  const reason = document.getElementById('adjustReason').value.trim();
  const signedBase = parseInt(document.getElementById('adjustConfirmPanel').dataset.signedBase, 10);
  const {status, data} = await apiPost('/api/daily-figures/adjustments', {
    product_id: product.id, date, shift, delta_base_qty: signedBase, reason,
  });
  if(status===201){
    toast('Adjustment recorded.');
    document.getElementById('adjustModal').classList.add('hidden');
    renderEntryCard();
  } else {
    const cmsg = document.getElementById('adjustConfirmMsg');
    cmsg.textContent = data.error || 'Could not save adjustment'; cmsg.className = 'msg err';
  }
});

// ---------- history ----------
function historyFilterParams(){
  const params = new URLSearchParams();
  params.set('limit', '200');
  if(document.getElementById('hDateFrom').value) params.set('date_from', document.getElementById('hDateFrom').value);
  if(document.getElementById('hDateTo').value) params.set('date_to', document.getElementById('hDateTo').value);
  const productText = document.getElementById('hProduct').value.trim().toLowerCase();
  if(productText){
    const match = products.find(p=>p.name.toLowerCase().includes(productText));
    if(match) params.set('product_id', match.id);
  }
  return params;
}

function hDateStr(offsetDays){
  const d = new Date(); d.setDate(d.getDate()+offsetDays);
  return d.toISOString().slice(0,10);
}
document.querySelectorAll('[data-hquick]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('[data-hquick]').forEach(b=>b.classList.toggle('active', b===btn));
    const q = btn.dataset.hquick;
    if(q==='today'){ document.getElementById('hDateFrom').value = hDateStr(0); document.getElementById('hDateTo').value = hDateStr(0); }
    if(q==='yesterday'){ document.getElementById('hDateFrom').value = hDateStr(-1); document.getElementById('hDateTo').value = hDateStr(-1); }
    if(q==='week'){ document.getElementById('hDateFrom').value = hDateStr(-6); document.getElementById('hDateTo').value = hDateStr(0); }
    if(q==='month'){ const d=new Date(); d.setDate(1); document.getElementById('hDateFrom').value = d.toISOString().slice(0,10); document.getElementById('hDateTo').value = hDateStr(0); }
    renderHistory();
  });
});
document.getElementById('hClearBtn').addEventListener('click', ()=>{
  document.getElementById('hDateFrom').value=''; document.getElementById('hDateTo').value=''; document.getElementById('hProduct').value='';
  document.querySelectorAll('[data-hquick]').forEach(b=>b.classList.remove('active'));
  renderHistory();
});
['hDateFrom','hDateTo','hProduct'].forEach(id=>{
  document.getElementById(id).addEventListener('input', ()=>renderHistory());
  document.getElementById(id).addEventListener('change', ()=>renderHistory());
});

function groupHistoryByDate(results){
  const groups = {};
  results.forEach(e=>{ (groups[e.date] = groups[e.date] || []).push(e); });
  return Object.keys(groups).sort((a,b)=> a<b?1:-1).map(date=>({date, items: groups[date]}));
}

async function renderHistory(){
  const params = historyFilterParams();
  const rows = await apiGet('/api/daily-figures/history?' + params.toString());
  const list = document.getElementById('histList');
  const results = Array.isArray(rows) ? rows : [];

  ['exportCsvBtn','exportXlsxBtn','exportPdfBtn'].forEach((id,i)=>{
    const fmt = ['csv','xlsx','pdf'][i];
    document.getElementById(id).href = '/api/daily-figures/export.'+fmt+'?'+params.toString();
  });

  // A raw cross-product piece total ("Produced (pieces)"/"Issued (pieces)")
  // isn't a meaningful business figure — different products have different
  // packaging, so summing their base units together can't be expressed in
  // book notation at all. Days Logged is the only summary stat that's
  // still a real, product-independent number.
  const days = new Set(results.map(e=>e.date)).size;
  document.getElementById('histSummary').innerHTML = `
    <div class="hist-stat" style="grid-column:1/-1;"><div class="n">${days}</div><div class="l">Days Logged</div></div>`;

  if(results.length===0){
    list.innerHTML = `<div class="empty-state"><div class="big">📋</div>No entries match these filters.</div>`;
    return;
  }

  // Collapsed by default (global History UX rule) — every date group,
  // including today's/the newest, starts collapsed; clicking the head
  // (date text or chevron) toggles it. No entry is hidden from the data,
  // only its display; Opening/Production/Returns/Issued/Closing values
  // themselves are untouched.
  const groups = groupHistoryByDate(results);
  list.innerHTML = groups.map(g => `
    <div class="date-group collapsed">
      <div class="date-group-head" data-toggle-hgroup aria-expanded="false" role="button" tabindex="0">
        <div><div class="date">${g.date}</div><div class="summary">${g.items.length} product line${g.items.length===1?'':'s'}</div></div>
        <span class="chev">▾</span>
      </div>
      <div class="date-group-body">
        ${g.items.map(e => `
          <div class="entry-row">
            <div>
              <div class="meta">${e.shift}</div>
              <div class="name">${escapeHtml(e.product_name)}</div>
              <div class="nums">Prod ${qtyLabel(e.production, e.packaging_rule)} · <span class="issued-link" data-drill="${e.product_id}|${e.date}|${e.shift}" style="text-decoration:underline;cursor:pointer;">Issued ${qtyLabel(e.issued, e.packaging_rule)}</span> · Returns ${qtyLabel(e.return_, e.packaging_rule)} · Closing ${qtyLabel(e.closing, e.packaging_rule)}</div>
            </div>
          </div>`).join('')}
      </div>
    </div>`).join('');

  list.querySelectorAll('[data-toggle-hgroup]').forEach(head=>{
    head.addEventListener('click', ()=>{
      const group = head.closest('.date-group');
      const nowCollapsed = group.classList.toggle('collapsed');
      head.setAttribute('aria-expanded', String(!nowCollapsed));
    });
    head.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); head.click(); }
    });
  });
  list.querySelectorAll('[data-drill]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const [productId, date, shift] = el.dataset.drill.split('|');
      const product = products.find(p=>String(p.id)===productId) || {id: parseInt(productId,10), name: ''};
      openIssuedBreakdown(product, date, shift);
    });
  });
}

// ---------- tabs ----------
function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===name));
  document.getElementById('tab-entry').classList.toggle('hidden', name!=='entry');
  document.getElementById('tab-history').classList.toggle('hidden', name!=='history');
  if(name==='history') renderHistory();
}
document.querySelectorAll('.tab[data-tab]').forEach(t=>t.addEventListener('click', ()=>switchTab(t.dataset.tab)));
document.getElementById('dateInput').addEventListener('change', async ()=>{ currentIdx=0; sessionValues={}; await loadProducts(); renderCurrentView(); });
document.getElementById('shiftInput').addEventListener('change', async ()=>{ currentIdx=0; sessionValues={}; await loadProducts(); renderCurrentView(); });
// ---------- login ----------
// Every role now lands on its own role-aware page after login — Viewer/
// Manager/Super Admin on Dashboard, Operator on the first enabled
// operational book — never on Daily Figures itself (see
// static/app-shell.js's resolveLanding(), which mirrors
// webapp/routes/pages.py's first_authorized_page() exactly). Navigating
// back to "/" later (e.g. via the reporting nav's "Daily Figures" link)
// goes through init()/boot() below instead, which does not redirect.
async function attemptLogin(){
  const username = document.getElementById('usernameInput').value;
  const password = document.getElementById('passwordInput').value;
  const res = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username, password})});
  const data = await res.json();
  if(!data.ok){
    document.getElementById('loginErr').textContent = data.error || 'Invalid username or password';
    return;
  }
  let flags = {};
  try{
    const flagsRes = await fetch('/api/feature-flags');
    const flagsData = await flagsRes.json();
    (Array.isArray(flagsData) ? flagsData : []).forEach(f=>{ flags[f.module_key] = f.enabled; });
  } catch(e){ /* resolveLanding treats an empty flags map as "everything enabled" */ }
  const landing = (window.AppShell && window.AppShell.resolveLanding)
    ? window.AppShell.resolveLanding(data.user.role, flags)
    : '/dashboard.html';
  window.location.href = landing;
}
document.getElementById('loginBtn').addEventListener('click', attemptLogin);
document.getElementById('passwordInput').addEventListener('keydown', e=>{ if(e.key==='Enter') attemptLogin(); });

// ---------- visibility: role and feature-flag state tracked independently ----------
// An element is visible only when BOTH its role check and its feature
// flag say so. Each is recorded on the element itself (defaulting to
// "allowed" when never set by that side) so either one can update
// independently, in any order, any number of times — including a flag
// flipping back on after having been off — without one silently undoing
// the other's decision.
function setRoleVisible(el, visible){
  el.dataset.roleVisible = visible ? 'true' : 'false';
  _recomputeVisibility(el);
}
function setFlagVisible(el, visible){
  el.dataset.flagVisible = visible ? 'true' : 'false';
  _recomputeVisibility(el);
}
function _recomputeVisibility(el){
  const roleOk = el.dataset.roleVisible !== 'false';
  const flagOk = el.dataset.flagVisible !== 'false';
  el.classList.toggle('hidden', !(roleOk && flagOk));
}

function applyUser(user){
  if(!user) return;
  currentUser = user;
  // Identity, role label, Home/Back/Logout, and the role-aware top nav are
  // all rendered by the shared static/app-shell.js into #appIdentityBar/
  // #appRoleNav — nothing page-specific to do with the user object here
  // beyond the entry wizard's own role-based field gating (see
  // renderEntryCard()). The Enter/History & Export tabs below are this
  // page's own internal tabs, shown to every role exactly like every other
  // module's internal tabs (New Dispatch/Dispatches, etc.).
}

// ---------- feature flags ----------
// Fetched once per boot (login_required, so this runs after a session is
// confirmed) — never per-interaction. Re-running this (it's also safe to
// call again later, e.g. after the admin toggles a flag on the same page)
// correctly re-shows a [data-module] element the moment its flag comes
// back on, for any role still allowed to see it — setFlagVisible always
// reflects the latest fetch, in either direction. Other pages simply see
// the current state on their next normal page load.
let featureFlagsCache = null;
async function applyFeatureFlags(){
  try{
    const flags = await apiGet('/api/feature-flags');
    featureFlagsCache = {};
    (Array.isArray(flags) ? flags : []).forEach(f=>{ featureFlagsCache[f.module_key] = f.enabled; });
    document.querySelectorAll('[data-module]').forEach(el=>{
      setFlagVisible(el, featureFlagsCache[el.dataset.module] !== false);
    });
  } catch(e){ /* fail safe: leave nav exactly as it was rather than hiding everything */ }
}

async function boot(user){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('appShell').classList.remove('hidden');
  document.getElementById('dateInput').value = todayStr();
  applyUser(user);
  await applyFeatureFlags();
  if(featureFlagsCache && featureFlagsCache.daily_figures === false){
    // This page IS the Daily Figures module. Unlike every other page, "/"
    // can't be server-side redirected when its own module is off (it's
    // also the only login page — see webapp/routes/pages.py) so this is
    // handled here instead, post-login, exactly once.
    if(featureFlagsCache.dispatch !== false){ window.location.href = '/dispatch.html'; return; }
    if(featureFlagsCache.history_exports !== false){ window.location.href = '/history.html'; return; }
    document.getElementById('appShell').innerHTML =
      '<div style="padding:60px 20px;text-align:center;">No modules are currently enabled. Contact your administrator.</div>';
    return;
  }
  // Fetched once here, not on every render — only Operator's UI depends on
  // these flags (Manager/Super Admin are always unlocked, Viewer is always
  // locked regardless of them).
  if(user.role === 'operator'){
    operatorPermissions = await apiGet('/api/admin/operator-daily-figure-permissions');
  }
  // Still loaded for every role, including Operator — the History tab's
  // product-name filter (shared by every role) depends on this list;
  // only the ENTRY tab's rendering branches by role, below.
  await loadProducts();
  renderCurrentView();

  const q = new URLSearchParams(window.location.search);
  if(q.get('tab') === 'history'){
    if(q.get('product')) document.getElementById('hProduct').value = q.get('product');
    switchTab('history');
  }
}

(async function init(){
  const s = await apiGet('/api/session');
  if(s && s.authed){
    businessToday = s.business_today || null;
    await boot(s.user);
  }
})();
</script>
