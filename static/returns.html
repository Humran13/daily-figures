<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1B2430">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Figures">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/app-shell.css">
<title>Returns — Daily Figures</title>
<style>
  :root{
    --ink:#1B2430; --ink-soft:#3D4756; --paper:#FCFAF6; --paper-dim:#F1EEE7;
    --line:#DEDACF; --teal:#1F8A70; --teal-dark:#166653; --amber:#E2A93B; --red:#C1443A;
    --mono:'SF Mono','Roboto Mono','Consolas',monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{ margin:0; font-family:var(--sans); background:var(--ink); color:var(--ink); min-height:100vh; }
  .shell{ max-width:560px; margin:0 auto; min-height:100vh; background:var(--paper); display:flex; flex-direction:column; }
  header{ background:var(--ink); color:var(--paper); padding:18px 20px 14px; position:sticky; top:0; z-index:10; }
  header .eyebrow{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#8A94A6; margin:0 0 4px; }
  header h1{ margin:0; font-size:19px; font-weight:700; display:flex; justify-content:space-between; align-items:center; }
  header h1 a{ color:#8A94A6; font-size:12px; font-weight:600; text-decoration:underline; }
  .tabs{ display:flex; gap:0; margin-top:14px; border-bottom:1px solid #333d4d; }
  .tab{ flex:1; text-align:center; padding:9px 0; font-size:13px; font-weight:600; color:#8A94A6; cursor:pointer; border-bottom:2px solid transparent; }
  .tab.active{ color:var(--paper); border-bottom-color:var(--amber); }
  main{ flex:1; padding:16px; padding-bottom:100px; }
  .hidden{ display:none !important; }
  .card{ background:white; border:1.5px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  label{ display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin-bottom:5px; }
  input, select, textarea{ width:100%; padding:12px 10px; border:1.5px solid var(--line); border-radius:8px; font-size:15px; font-family:var(--sans); background:white; color:var(--ink); }
  textarea{ min-height:60px; resize:vertical; }
  .field{ margin-bottom:14px; position:relative; }
  .row2{ display:flex; gap:10px; }
  .row2 > .field{ flex:1; }
  button{ font-family:var(--sans); cursor:pointer; border:none; border-radius:10px; font-weight:700; }
  .btn{ padding:14px; font-size:15px; width:100%; }
  .btn-primary{ background:var(--teal); color:white; }
  .btn-primary:disabled{ opacity:.5; }
  .btn-ghost{ background:var(--paper-dim); color:var(--ink); }
  .btn-danger{ background:var(--red); color:white; }
  .btn-small{ padding:8px 12px; font-size:12px; border-radius:8px; }
  .nav-row{ display:flex; gap:10px; margin-top:6px; }
  .nav-row > button{ flex:1; }
  .autocomplete-list{ position:absolute; top:100%; left:0; right:0; background:white; border:1.5px solid var(--line); border-top:none; border-radius:0 0 8px 8px; max-height:220px; overflow-y:auto; z-index:20; }
  .autocomplete-item{ padding:10px; font-size:14px; border-bottom:1px solid var(--paper-dim); cursor:pointer; }
  .autocomplete-item:hover, .autocomplete-item.active{ background:var(--paper-dim); }
  .line-card{ background:var(--paper-dim); border-radius:12px; padding:12px; margin-bottom:10px; }
  .line-card .head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .line-card .name{ font-weight:700; font-size:14px; }
  .line-card .remove{ background:none; color:var(--red); font-size:13px; padding:2px 6px; }
  .qty-row{ display:flex; gap:8px; }
  .qty-field{ flex:1; text-align:center; }
  .qty-field label{ text-align:center; }
  .qty-field input{ text-align:center; font-family:var(--mono); font-weight:700; font-size:16px; padding:10px 4px; }
  .hint{ font-size:11px; color:var(--ink-soft); margin-top:4px; }
  .msg{ font-size:12px; margin-top:8px; min-height:16px; }
  .msg.err{ color:var(--red); }
  .msg.ok{ color:var(--teal-dark); }
  .pill{ display:inline-block; padding:3px 9px; border-radius:20px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  .pill-draft{ background:#FCEfd7; color:#8a5a12; }
  .pill-finalized{ background:#E4F3EC; color:var(--teal-dark); }
  .pill-void{ background:#F3E4E4; color:var(--red); }
  .row-item{ background:white; border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px; cursor:pointer; }
  .row-item .top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
  .row-item .num{ font-family:var(--mono); font-weight:700; font-size:13px; }
  .row-item .meta{ font-size:12px; color:var(--ink-soft); }
  .filters{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; align-items:flex-end; }
  .filters .field-labeled{ display:flex; flex-direction:column; gap:3px; flex:1; min-width:130px; }
  .filters .field-labeled label{ font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin:0; }
  .filters .field-labeled input{ width:100%; min-width:0; }
  .filters input, .filters select{ width:auto; flex:1; min-width:110px; font-size:13px; padding:9px 8px; }
  .quick-filters{ display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
  .quick-filters button.active{ background:var(--teal); color:white; }
  .export-row{ display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .date-group{ margin-bottom:14px; }
  .date-group-head{ display:flex; justify-content:space-between; align-items:center; padding:10px 4px; cursor:pointer; }
  .date-group-head .date{ font-weight:700; font-size:14px; }
  .date-group-head .summary{ font-size:11px; color:var(--ink-soft); }
  .date-group-head .chev{ transition:transform .15s ease; color:var(--ink-soft); }
  .date-group.collapsed .chev{ transform:rotate(-90deg); }
  .date-group.collapsed .date-group-body{ display:none; }
  .empty-state{ text-align:center; padding:50px 20px; color:var(--ink-soft); }
  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:white; padding:12px 20px; border-radius:30px; font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .25s ease; z-index:50; max-width:90%; text-align:center; }
  .toast.show{ opacity:1; }
  .detail-line{ display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--paper-dim); font-size:14px; }
  .add-product-bar{ display:flex; gap:8px; margin-bottom:14px; }
  .print-letterhead{ display:none; }
  @media print {
    header, .tabs, .no-print { display:none !important; }
    body, .shell { background:white; }
    .print-letterhead{ display:flex !important; align-items:center; gap:10px; margin-bottom:14px; }
    .print-letterhead img{ max-height:50px; max-width:140px; object-fit:contain; }
    .print-letterhead .name{ font-weight:700; font-size:16px; }
  }
</style>
</head>
<body>

<div id="gate" class="hidden" style="padding:60px 20px;text-align:center;color:white;">Sign in from the main app first.</div>

<div class="shell hidden" id="appShell">
  <div id="appIdentityBar" class="no-print"></div>
  <header class="no-print">
    <p class="eyebrow">Returns Book</p>
    <h1>Returns</h1>
    <div class="tabs">
      <div class="tab" data-tab="new">New Return</div>
      <div class="tab active" data-tab="list">Returns History</div>
    </div>
  </header>
  <div id="appRoleNav" class="no-print"></div>

  <main>
    <!-- LIST -->
    <div id="tab-list">
      <div class="quick-filters no-print">
        <button class="btn-ghost btn-small" data-quick="today">Today</button>
        <button class="btn-ghost btn-small" data-quick="yesterday">Yesterday</button>
        <button class="btn-ghost btn-small" data-quick="week">This week</button>
        <button class="btn-ghost btn-small" data-quick="month">This month</button>
      </div>
      <div class="filters no-print">
        <div class="field-labeled"><label>Exact Date</label><input id="fDate" type="date"></div>
        <div class="field-labeled"><label>From Date</label><input id="fDateFrom" type="date"></div>
        <div class="field-labeled"><label>To Date</label><input id="fDateTo" type="date"></div>
        <input id="fReturnedBy" placeholder="Returned by">
        <input id="fProduct" placeholder="Product">
        <select id="fStatus">
          <option value="">All statuses</option>
          <option value="draft">Draft</option>
          <option value="finalized">Finalized</option>
          <option value="void">Void</option>
        </select>
        <button class="btn-ghost btn-small" id="clearFiltersBtn">Clear all</button>
      </div>
      <div class="export-row no-print">
        <span class="hint">Export current results:</span>
        <a href="#" id="exportCsv" class="btn-small btn-ghost" style="text-decoration:none;">CSV</a>
        <a href="#" id="exportXlsx" class="btn-small btn-ghost" style="text-decoration:none;">Excel</a>
        <a href="#" id="exportPdf" class="btn-small btn-ghost" style="text-decoration:none;">PDF</a>
      </div>
      <div id="returnList"></div>
    </div>

    <!-- NEW / EDIT -->
    <div id="tab-new" class="hidden">
      <div class="card">
        <div class="field"><label>Date</label><input type="date" id="rDate"></div>
        <div class="field" style="position:relative;">
          <label>Returned By <span style="font-weight:400;">(customer, truck, or field representative)</span></label>
          <input id="rReturnedBySearch" placeholder="Type to search customers, or type a free-text name…" autocomplete="off">
          <div class="autocomplete-list hidden" id="returnedByResults"></div>
          <div class="hint" id="returnedByHint"></div>
        </div>
        <div class="field"><label>Name &amp; Sign <span style="font-weight:400;">(digital signature)</span></label><input id="rSignedByName" placeholder="Typed name standing in for a signature"></div>
        <div class="field"><label>Remarks <span style="font-weight:400;">(optional)</span></label><textarea id="rRemarks"></textarea></div>
      </div>

      <div class="card">
        <label style="margin-bottom:10px;">Product lines</label>
        <div id="lineList"></div>
        <div class="add-product-bar">
          <select id="addProductSelect" style="flex:1;"><option value="">+ Add a product…</option></select>
        </div>
      </div>

      <div class="msg" id="saveMsg"></div>
      <div class="nav-row">
        <button class="btn btn-ghost" id="saveDraftBtn">Save draft</button>
        <button class="btn btn-primary" id="finalizeBtn">Finalize</button>
      </div>
    </div>

    <!-- DETAIL -->
    <div id="tab-detail" class="hidden">
      <div class="card no-print">
        <button class="btn-ghost btn-small" id="backToListBtn">&larr; Back to list</button>
      </div>
      <div class="print-letterhead" id="printLetterhead"></div>
      <div class="card" id="detailHeader"></div>
      <div class="card" id="detailLines"></div>
      <div class="msg" id="detailMsg"></div>
      <div class="nav-row no-print" id="detailActions"></div>

      <!-- Preview — strictly read-only full-record view. See
           static/dispatch.html's identical panel for the full rationale. -->
      <div class="card hidden no-print" id="previewPanel">
        <h3 style="margin-top:0;">Preview</h3>
        <div id="previewBody"></div>
        <div class="nav-row">
          <button class="btn btn-ghost" id="previewCloseBtn">Close preview</button>
        </div>
      </div>

      <!-- Correct Record — final pre-deployment correction. See
           static/dispatch.html's identical panel for the full rationale.
           Return Date/Returned By/Name & Sign mirror the same fields the
           New Return form already collects (see #rDate/#rReturnedBySearch/
           #rSignedByName above), just with a correct-prefixed id/handler
           set so both forms can coexist on this page. -->
      <div class="card hidden no-print" id="correctPanel">
        <h3 style="margin-top:0;">Correct record</h3>
        <div class="field"><label>Return Date</label><input type="date" id="correctDate"></div>
        <div class="field" style="position:relative;">
          <label>Returned By <span style="font-weight:400;">(customer, truck, or field representative)</span></label>
          <input id="correctReturnedBySearch" placeholder="Type to search customers, or type a free-text name…" autocomplete="off">
          <div class="autocomplete-list hidden" id="correctReturnedByResults"></div>
          <div class="hint" id="correctReturnedByHint"></div>
        </div>
        <div class="field"><label>Name &amp; Sign <span style="font-weight:400;">(digital signature)</span></label><input id="correctSignedByName" placeholder="Typed name standing in for a signature"></div>
        <div id="correctLineList"></div>
        <div class="row">
          <div style="flex:1;"><label>Add a product</label>
            <select id="correctAddProductSelect"><option value="">+ Add a product…</option></select>
          </div>
        </div>
        <div><label>Notes</label><textarea id="correctNotes" rows="2"></textarea></div>
        <div><label>Correction reason (required)</label><textarea id="correctReason" rows="2" placeholder="Why is this correction needed?"></textarea></div>
        <div class="msg" id="correctMsg"></div>
        <div class="nav-row">
          <button class="btn btn-primary" id="correctSaveBtn">Save correction</button>
          <button class="btn btn-ghost" id="correctCancelBtn">Cancel</button>
        </div>
      </div>

      <!-- Delete — permanent hard delete, Manager/Super Administrator only.
           Not void, not a status change. See static/dispatch.html's
           identical panel for the full rationale. -->
      <div class="card hidden no-print" id="deletePanel">
        <h3 style="margin-top:0;color:var(--red);">Delete this Return permanently?</h3>
        <p class="hint" id="deleteSummary" style="margin-bottom:12px;"></p>
        <p class="hint" style="color:var(--red);margin-bottom:12px;">This will permanently remove this Return and its product quantities. Stock figures will be recalculated.</p>
        <div><label>Deletion reason (required)</label><textarea id="deleteReason" rows="2" placeholder="Why is this return being deleted?"></textarea></div>
        <div class="msg" id="deleteMsg"></div>
        <div class="nav-row">
          <button class="btn btn-danger" id="deleteConfirmBtn">Delete Return</button>
          <button class="btn btn-ghost" id="deleteCancelBtn">Cancel</button>
        </div>
      </div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
let currentUser = null;
let productsCache = [];
let currentLines = [];
let editingReturnId = null;
let editingReturnOriginalLineIds = []; // captured when opening a draft for edit — used to diff which lines to remove
let currentDetail = null;
let selectedCustomer = null; // {id, name}
const OTHER_FREE_TEXT = '__free_text__';

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
async function api(path, opts){
  const res = await fetch(path, {headers:{'Content-Type':'application/json'}, ...opts});
  const data = await res.json().catch(()=>({}));
  return {status: res.status, data};
}
function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- company branding ----------
let brandingCache = null;
async function applyBranding(){
  try{
    const res = await fetch('/api/branding');
    brandingCache = await res.json();
    document.querySelectorAll('[data-brand-name]').forEach(el=>{ el.textContent = brandingCache.display_name; });
    document.querySelectorAll('[data-brand-logo]').forEach(el=>{
      if(brandingCache.logo_url){ el.src = brandingCache.logo_url; el.classList.remove('hidden'); }
      else { el.classList.add('hidden'); }
    });
    renderPrintLetterhead();
  } catch(e){ /* branding is cosmetic — never block the app over a failed fetch */ }
}
function renderPrintLetterhead(){
  const el = document.getElementById('printLetterhead');
  if(!el || !brandingCache) return;
  el.innerHTML = (brandingCache.logo_url ? `<img src="${brandingCache.logo_url}" alt="">` : '') +
    `<span class="name">${escapeHtml(brandingCache.display_name)}</span>`;
}
applyBranding();

// ---------- visibility: role and feature-flag state tracked independently ----------
function setRoleVisible(el, visible){
  el.dataset.roleVisible = visible ? 'true' : 'false';
  _recomputeVisibility(el);
}
function setFlagVisible(el, visible){
  el.dataset.flagVisible = visible ? 'true' : 'false';
  _recomputeVisibility(el);
}
function _recomputeVisibility(el){
  const roleOk = el.dataset.roleVisible !== 'false';
  const flagOk = el.dataset.flagVisible !== 'false';
  el.classList.toggle('hidden', !(roleOk && flagOk));
}

// ---------- feature flags ----------
let featureFlagsCache = null;
async function applyFeatureFlags(){
  try{
    const {data} = await api('/api/feature-flags');
    featureFlagsCache = {};
    (Array.isArray(data) ? data : []).forEach(f=>{ featureFlagsCache[f.module_key] = f.enabled; });
    document.querySelectorAll('[data-module]').forEach(el=>{
      setFlagVisible(el, featureFlagsCache[el.dataset.module] !== false);
    });
  } catch(e){ /* fail safe: leave nav exactly as it was rather than hiding everything */ }
}

// ---------- tabs ----------
function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===name));
  document.getElementById('tab-list').classList.toggle('hidden', name!=='list');
  document.getElementById('tab-new').classList.toggle('hidden', name!=='new');
  document.getElementById('tab-detail').classList.toggle('hidden', name!=='detail');
  if(name==='list') loadList();
}
document.querySelectorAll('.tab[data-tab]').forEach(t=>t.addEventListener('click', ()=>{
  if(t.dataset.tab==='new') resetForm();
  switchTab(t.dataset.tab);
}));

// ---------- returned-by search (customer, or free text) ----------
let returnedBySearchTimer;
document.getElementById('rReturnedBySearch').addEventListener('input', (e)=>{
  selectedCustomer = null;
  document.getElementById('returnedByHint').textContent = '';
  clearTimeout(returnedBySearchTimer);
  const q = e.target.value.trim();
  if(!q){ document.getElementById('returnedByResults').classList.add('hidden'); return; }
  returnedBySearchTimer = setTimeout(async ()=>{
    const {data} = await api(`/api/admin/customers?q=${encodeURIComponent(q)}`);
    const results = document.getElementById('returnedByResults');
    const items = Array.isArray(data) ? data : [];
    results.innerHTML = items.map(c=>`<div class="autocomplete-item" data-id="${c.id}" data-name="${escapeHtml(c.name)}">${escapeHtml(c.name)}</div>`).join('')
      + `<div class="autocomplete-item" data-free="1" style="font-weight:700;color:var(--teal-dark);">Use "${escapeHtml(q)}" as free text (no customer match)</div>`;
    results.classList.remove('hidden');
    results.querySelectorAll('[data-id]').forEach(el=>{
      el.addEventListener('click', ()=>{
        selectedCustomer = {id: parseInt(el.dataset.id,10), name: el.dataset.name};
        document.getElementById('rReturnedBySearch').value = el.dataset.name;
        document.getElementById('returnedByHint').textContent = 'Matched to an existing customer';
        results.classList.add('hidden');
      });
    });
    const freeEl = results.querySelector('[data-free]');
    if(freeEl) freeEl.addEventListener('click', ()=>{
      selectedCustomer = null;
      document.getElementById('returnedByHint').textContent = 'Recorded as free text (not linked to a customer record)';
      results.classList.add('hidden');
    });
  }, 200);
});
document.addEventListener('click', (e)=>{
  if(!e.target.closest('#rReturnedBySearch') && !e.target.closest('#returnedByResults')){
    document.getElementById('returnedByResults').classList.add('hidden');
  }
});

// ---------- products & lines ----------
async function loadProducts(){
  // Stage 8 Part 2: ?sort=usage ranks by the global, shared quick-selection
  // score (frequency + recency of finalized use) — never a per-user or
  // per-browser ranking, and never affects admin configuration screens,
  // which still call this same endpoint with no sort param.
  const {data} = await api('/api/admin/products?sort=usage');
  productsCache = Array.isArray(data) ? data : [];
  const select = document.getElementById('addProductSelect');
  const optionHtml = p => `<option value="${p.id}" ${!p.packaging_rule ? 'disabled' : ''}>${escapeHtml(p.name)}${!p.packaging_rule ? ' (not configured)' : ''}</option>`;
  const frequent = productsCache.filter(p=>p.frequently_used);
  const rest = productsCache.filter(p=>!p.frequently_used);
  select.innerHTML = '<option value="">+ Add a product…</option>' +
    (frequent.length ? `<optgroup label="Frequently used">${frequent.map(optionHtml).join('')}</optgroup>` : '') +
    (frequent.length && rest.length ? `<optgroup label="All products">${rest.map(optionHtml).join('')}</optgroup>` : rest.map(optionHtml).join(''));
}
document.getElementById('addProductSelect').addEventListener('change', (e)=>{
  const id = parseInt(e.target.value, 10);
  if(!id) return;
  const product = productsCache.find(p=>p.id===id);
  if(currentLines.some(l=>l.product_id===id)){ toast('Already on this return — edit the existing line.'); e.target.value=''; return; }
  currentLines.push({product_id: id, product_name: product.name, rule: product.packaging_rule, cartons:0, packs:0, pieces:0});
  e.target.value = '';
  renderLines();
});

function ruleHint(rule){
  if(!rule) return '';
  return rule.carton_to_pieces
    ? `1 carton = ${rule.carton_to_pieces} pieces`
    : `1 carton = ${rule.cartons_to_packs} packs · 1 pack = ${rule.packs_to_pieces} pieces`;
}
function lineTotalPieces(line){
  const r = line.rule;
  if(!r) return 0;
  if(r.carton_to_pieces) return line.cartons * r.carton_to_pieces + line.pieces;
  return (line.cartons * r.cartons_to_packs + line.packs) * r.packs_to_pieces + line.pieces;
}

function renderLines(){
  const container = document.getElementById('lineList');
  if(currentLines.length===0){
    container.innerHTML = '<p class="hint">No products added yet — pick one below.</p>';
    return;
  }
  container.innerHTML = currentLines.map((line, idx) => `
    <div class="line-card">
      <div class="head">
        <span class="name">${escapeHtml(line.product_name)}</span>
        <button class="remove" data-remove="${idx}">Remove</button>
      </div>
      <div class="qty-row">
        <div class="qty-field"><label>Cartons</label><input type="number" min="0" inputmode="numeric" data-qty="${idx}" data-unit="cartons" value="${line.cartons}"></div>
        ${line.rule && !line.rule.carton_to_pieces ? `<div class="qty-field"><label>Packs</label><input type="number" min="0" inputmode="numeric" data-qty="${idx}" data-unit="packs" value="${line.packs}"></div>` : ''}
        <div class="qty-field"><label>Pieces</label><input type="number" min="0" inputmode="numeric" data-qty="${idx}" data-unit="pieces" value="${line.pieces}"></div>
      </div>
      <div class="hint" data-hint="${idx}">${ruleHint(line.rule)} — total ${lineTotalPieces(line)} pieces</div>
    </div>
  `).join('');

  container.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ currentLines.splice(parseInt(btn.dataset.remove,10),1); renderLines(); });
  });
  container.querySelectorAll('[data-qty]').forEach(input=>{
    input.addEventListener('input', ()=>{
      const idx = parseInt(input.dataset.qty, 10);
      const unit = input.dataset.unit;
      const parsed = parseInt(input.value, 10);
      currentLines[idx][unit] = Number.isNaN(parsed) ? 0 : parsed;
      updateLineHint(idx);
    });
    attachZeroClearBehavior(input);
  });
}

function attachZeroClearBehavior(input){
  input.addEventListener('focus', ()=>{
    if(input.value === '0') input.value = '';
  });
  input.addEventListener('blur', ()=>{
    if(input.value.trim() === '') input.value = '0';
  });
}

function updateLineHint(idx){
  const line = currentLines[idx];
  if(!line) return;
  const hintEl = document.querySelector(`[data-hint="${idx}"]`);
  if(hintEl) hintEl.textContent = `${ruleHint(line.rule)} — total ${lineTotalPieces(line)} pieces`;
}

// Name & Sign defaults to the logged-in account's own identity — never a
// manually-typed browser value — matching the authenticated session,
// exactly like created_by/finalized_by everywhere else in this app. An
// Operator's signer is always themselves: the field is locked (server
// enforces this regardless, but the UI should not invite typing a value
// that will be silently overridden). Manager/Super Administrator start
// with their own name too but may override it when the existing business
// workflow requires recording another authorized person.
function applySignerDefault(){
  const input = document.getElementById('rSignedByName');
  if(!currentUser){ input.value = ''; return; }
  input.value = currentUser.username;
  input.readOnly = currentUser.role === 'operator';
  input.title = input.readOnly ? 'Signed as your own account — Operators cannot sign as someone else.' : '';
}

function applyViewerReadOnly(){
  if(!currentUser || currentUser.role !== 'viewer') return;
  document.getElementById('saveDraftBtn').disabled = true;
  document.getElementById('finalizeBtn').disabled = true;
  document.getElementById('saveMsg').textContent = 'Read-only — your account cannot create or edit returns.';
  document.getElementById('saveMsg').className = 'msg';
}

async function saveReturn(finalize){
  const msg = document.getElementById('saveMsg');
  if(currentLines.length===0){ msg.textContent='Add at least one product.'; msg.className='msg err'; return; }

  const draftBtn = document.getElementById('saveDraftBtn');
  const finalizeBtn = document.getElementById('finalizeBtn');
  draftBtn.disabled = true; finalizeBtn.disabled = true;
  try{
    if(editingReturnId) await saveEditedReturnDraft(finalize, msg);
    else await saveNewReturn(finalize, msg);
  } finally {
    draftBtn.disabled = false; finalizeBtn.disabled = false;
  }
}
document.getElementById('saveDraftBtn').addEventListener('click', ()=>saveReturn(false));
document.getElementById('finalizeBtn').addEventListener('click', ()=>saveReturn(true));

async function saveNewReturn(finalize, msg){
  const freeTextName = selectedCustomer ? null : (document.getElementById('rReturnedBySearch').value.trim() || null);
  const body = {
    date: document.getElementById('rDate').value,
    customer_id: selectedCustomer ? selectedCustomer.id : null,
    returned_by_name: freeTextName,
    signed_by_name: document.getElementById('rSignedByName').value || null,
    remarks: document.getElementById('rRemarks').value || null,
    lines: currentLines.map(l => ({product_id: l.product_id, cartons: l.cartons, packs: l.packs, pieces: l.pieces})),
  };

  const {status, data} = await api('/api/returns', {method:'POST', body: JSON.stringify(body)});
  if(status !== 201){
    msg.textContent = data.error || 'Could not save return.';
    msg.className = 'msg err';
    return;
  }

  if(finalize){
    const fin = await api(`/api/returns/${data.id}/finalize`, {method:'POST'});
    if(fin.status !== 200){
      toast('Saved as draft, but finalizing failed: ' + (fin.data.error||''));
      openDetail(data.id);
      switchTab('detail');
      return;
    }
  }

  toast(finalize ? 'Return finalized.' : 'Draft saved.');
  resetForm();
  switchTab('list');
}

// Draft editing (Operator on their own draft, or Manager/Super Admin on
// any draft — enforced server-side by _load_editable_return()/can_edit(),
// never only by hiding the button). Reuses the exact same header/line
// endpoints the backend already exposed for this — update_return() (PATCH)
// plus add_line/update_line/remove_line — rather than a second, competing
// edit engine. Not atomic across the several calls the way Dispatch's
// single PUT /lines is (Returns has no bulk-replace endpoint), so new
// lines are added and existing ones updated BEFORE any removal, which
// guarantees the record never transiently drops to zero lines (remove_line
// refuses to remove the last remaining line).
async function saveEditedReturnDraft(finalize, msg){
  const id = editingReturnId;
  const freeTextName = selectedCustomer ? null : (document.getElementById('rReturnedBySearch').value.trim() || null);
  const headerBody = {
    date: document.getElementById('rDate').value,
    customer_id: selectedCustomer ? selectedCustomer.id : null,
    returned_by_name: freeTextName,
    signed_by_name: document.getElementById('rSignedByName').value || null,
    remarks: document.getElementById('rRemarks').value || null,
  };
  const patchRes = await api(`/api/returns/${id}`, {method:'PATCH', body: JSON.stringify(headerBody)});
  if(patchRes.status !== 200){
    msg.textContent = patchRes.data.error || 'Could not save return.';
    msg.className = 'msg err';
    return;
  }

  const keepIds = new Set();
  for(const line of currentLines){
    const lineBody = {product_id: line.product_id, cartons: line.cartons, packs: line.packs, pieces: line.pieces};
    if(line.id == null){
      const r = await api(`/api/returns/${id}/lines`, {method:'POST', body: JSON.stringify(lineBody)});
      if(r.status !== 201){ msg.textContent = r.data.error || 'Could not save product lines.'; msg.className = 'msg err'; return; }
    } else {
      keepIds.add(line.id);
      const r = await api(`/api/returns/${id}/lines/${line.id}`, {method:'PATCH', body: JSON.stringify(lineBody)});
      if(r.status !== 200){ msg.textContent = r.data.error || 'Could not save product lines.'; msg.className = 'msg err'; return; }
    }
  }
  for(const origId of editingReturnOriginalLineIds){
    if(!keepIds.has(origId)){
      const r = await api(`/api/returns/${id}/lines/${origId}`, {method:'DELETE'});
      if(r.status !== 200){ msg.textContent = r.data.error || 'Could not save product lines.'; msg.className = 'msg err'; return; }
    }
  }

  if(finalize){
    const fin = await api(`/api/returns/${id}/finalize`, {method:'POST'});
    if(fin.status !== 200){
      toast('Draft saved, but finalizing failed: ' + (fin.data.error||''));
      openDetail(id);
      switchTab('detail');
      return;
    }
    toast('Return finalized.');
    resetForm();
    switchTab('list');
    return;
  }

  toast('Draft saved.');
  resetForm();
  switchTab('list');
}

function openEditDraft(data){

  switchTab('new');
}

function statusPill(status){

}

// Metro Sales stock-posting indicator — purely a presentation mapping of
// the two backend-computed flags (is_metro_sales_return/
// stock_posting_eligible, from svc.is_metro_sales_return()/svc.
// is_return_stock_posting_eligible() — the one authoritative rule). The
// frontend never decides Monday/Metro-Sales itself, only how to label
// what the backend already decided. Not a new status — Draft/Finalized/
// Void are unchanged; this is an additional read-only badge shown only
// for a finalized Metro Sales return.
function metroStockBadge(r){
  if(!r.is_metro_sales_return || r.status !== 'finalized') return '';
  return r.stock_posting_eligible
    ? `<span class="pill" style="background:#E4F3EC;color:#166653;">Posted to stock</span>`
    : `<span class="pill" style="background:#FCEfd7;color:#8a5a12;">Recorded — posts to stock Monday only</span>`;
}

function currentFilterParams(){
  const params = new URLSearchParams();
  const map = {
    fDate: 'date', fDateFrom: 'date_from', fDateTo: 'date_to',
    fStatus: 'status', fReturnedBy: 'returned_by',
  };
  for(const [id, param] of Object.entries(map)){
    const el = document.getElementById(id);
    if(el && el.value) params.set(param, el.value);
  }
  const productText = document.getElementById('fProduct').value.trim().toLowerCase();
  if(productText){
    const matches = productsCache.filter(p=>p.name.toLowerCase().includes(productText));
    if(matches.length===1) params.set('product_id', matches[0].id);
  }
  return params;
}

function dateStr(offsetDays){
  const d = new Date();
  d.setDate(d.getDate()+offsetDays);
  return d.toISOString().slice(0,10);
}
document.querySelectorAll('[data-quick]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('[data-quick]').forEach(b=>b.classList.toggle('active', b===btn));
    document.getElementById('fDate').value = '';
    const q = btn.dataset.quick;
    if(q==='today'){ document.getElementById('fDateFrom').value = dateStr(0); document.getElementById('fDateTo').value = dateStr(0); }
    if(q==='yesterday'){ document.getElementById('fDateFrom').value = dateStr(-1); document.getElementById('fDateTo').value = dateStr(-1); }
    if(q==='week'){ document.getElementById('fDateFrom').value = dateStr(-6); document.getElementById('fDateTo').value = dateStr(0); }
    if(q==='month'){ const d=new Date(); d.setDate(1); document.getElementById('fDateFrom').value = d.toISOString().slice(0,10); document.getElementById('fDateTo').value = dateStr(0); }
    loadList();
  });
});

function groupByDate(results){
  const groups = {};
  results.forEach(r=>{ (groups[r.date] = groups[r.date] || []).push(r); });
  return Object.keys(groups).sort((a,b)=> a<b?1:-1).map(date=>({date, items: groups[date]}));
}

async function loadList(){
  const params = currentFilterParams();
  const {data} = await api('/api/returns?limit=200&' + params.toString());
  let results = (data && data.results) || [];

  ['exportCsv','exportXlsx','exportPdf'].forEach((linkId, i)=>{
    const fmt = ['csv','xlsx','pdf'][i];
    document.getElementById(linkId).href = '/api/returns/export.'+fmt+'?'+params.toString();
  });

  const list = document.getElementById('returnList');
  if(results.length===0){
    list.innerHTML = '<div class="empty-state">No returns match these filters.</div>';
    return;
  }

  // Collapsed by default (global History UX rule) — every date group,
  // including today's/the newest, starts collapsed; clicking the head
  // (date text or chevron — the whole head is one click target below)
  // toggles it. No return is hidden from the data, only its display.
  const groups = groupByDate(results);
  list.innerHTML = groups.map(g => {
    const finalizedCount = g.items.filter(r=>r.status==='finalized').length;
    return `
    <div class="date-group collapsed">
      <div class="date-group-head" data-toggle-group aria-expanded="false" role="button" tabindex="0">
        <div><div class="date">${g.date}</div><div class="summary">${g.items.length} return${g.items.length===1?'':'s'} · ${finalizedCount} finalized</div></div>
        <span class="chev">▾</span>
      </div>
      <div class="date-group-body">
        ${g.items.map(r => `
          <div class="row-item" data-open="${r.id}">
            <div class="top">
              <span class="num">Return #${r.id}</span>
              ${statusPill(r.status)}${metroStockBadge(r)}
            </div>
            <div class="meta">${escapeHtml(r.returned_by_name||'—')}${r.signed_by_name ? ' · signed '+escapeHtml(r.signed_by_name) : ''}</div>
          </div>`).join('')}
      </div>
    </div>`;
  }).join('');

  list.querySelectorAll('[data-toggle-group]').forEach(head=>{
    head.addEventListener('click', (e)=>{
      if(e.target.closest('[data-open]')) return;
      const group = head.closest('.date-group');
      const nowCollapsed = group.classList.toggle('collapsed');
      head.setAttribute('aria-expanded', String(!nowCollapsed));
    });
    head.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); head.click(); }
    });
  });
  list.querySelectorAll('[data-open]').forEach(el=>{
    el.addEventListener('click', ()=>{ openDetail(parseInt(el.dataset.open,10)); switchTab('detail'); });
  });
}

function loadFilterOptionsFromUrl(){

}

async function openDetail(id){
  const {data} = await api(`/api/returns/${id}`);
  currentDetail = data;
  document.getElementById('detailHeader').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <span class="num" style="font-family:var(--mono);font-weight:700;">Return #${data.id}</span>
      <span>${statusPill(data.status)}${metroStockBadge(data)}</span>
    </div>
    <div class="hint">${data.date}</div>
    <div style="margin-top:8px;"><strong>${escapeHtml(data.returned_by_name||'—')}</strong></div>
    ${data.signed_by_name ? `<div class="hint">Signed: ${escapeHtml(data.signed_by_name)}</div>` : ''}
    <div class="hint">Received by: ${escapeHtml(data.received_by_username||'—')}</div>
    <div class="hint">Verified by: ${escapeHtml(data.verified_by_username||'—')}</div>
    ${data.remarks ? `<div class="hint" style="white-space:pre-wrap;margin-top:6px;">${escapeHtml(data.remarks)}</div>` : ''}
    ${data.void_reason ? `<div class="hint" style="color:var(--red);margin-top:6px;">Voided: ${escapeHtml(data.void_reason)}</div>` : ''}
  `;
  document.getElementById('detailLines').innerHTML = data.lines.map(l => `
    <div class="detail-line">
      <span>${escapeHtml(l.product_name)}</span>
      <span style="font-family:var(--mono);">${l.quantity_label}</span>
    </div>
  `).join('');

  // Standardized History action set: Preview, Edit, Delete, Print. See
  // static/dispatch.html's identical block for the full rationale — same
  // single-Edit-per-state rule, same Reopen/Void/Duplicate UI removal.
  const actions = document.getElementById('detailActions');
  const buttons = [];
  const isElevated = currentUser && ['super_admin','manager'].includes(currentUser.role);
  const isViewer = currentUser && currentUser.role === 'viewer';
  const isOperator = currentUser && currentUser.role === 'operator';
  const ownsRecord = currentUser && data.created_by === currentUser.id;
  const canEditDraft = data.status === 'draft' && (isElevated || ownsRecord);
  // Finalized Edit — Manager/Super Admin on any record; an Operator only
  // on a record they themselves created (server-enforced by the
  // /correct route's own ownership check).
  const canEditFinalized = data.status !== 'draft' && data.status !== 'void' && (isElevated || (isOperator && ownsRecord));
  if(data.status === 'draft'){
    buttons.push(`<button class="btn btn-primary" data-action="finalize">Finalize</button>`);
  }
  if(!isViewer) buttons.push(`<button class="btn btn-ghost" data-action="preview">Preview</button>`);
  if(data.status === 'draft'){
    if(canEditDraft) buttons.push(`<button class="btn btn-ghost" data-action="edit-draft">Edit</button>`);
  } else if(canEditFinalized){
    buttons.push(`<button class="btn btn-ghost" data-action="correct">Edit</button>`);
  }
  if(isElevated && data.status !== 'void'){
    buttons.push(`<button class="btn btn-danger" data-action="delete">Delete</button>`);
  }
  buttons.push(`<button class="btn btn-ghost" data-action="print">Print</button>`);
  actions.innerHTML = buttons.join('');

  document.getElementById('previewPanel').classList.add('hidden');
  document.getElementById('correctPanel').classList.add('hidden');
  document.getElementById('deletePanel').classList.add('hidden');
  const msg = document.getElementById('detailMsg');
  msg.textContent = '';

  actions.querySelectorAll('[data-action]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const action = btn.dataset.action;
      if(action === 'print'){ window.print(); return; }
      if(action === 'finalize'){
        const r = await api(`/api/returns/${data.id}/finalize`, {method:'POST'});
        if(r.status===200){ toast('Finalized.'); openDetail(data.id); } else { msg.textContent = r.data.error; msg.className='msg err'; }
        return;
      }
      if(action === 'preview'){ openPreviewPanel(data); return; }
      if(action === 'edit-draft'){ openEditDraft(data); return; }
      if(action === 'correct'){ openCorrectPanel(data); return; }
      if(action === 'delete'){ openDeletePanel(data); return; }
    });
  });
}

  if(correctLines.length === 0){
    container.innerHTML = '<p class="hint">No product lines — add one below (at least one is required).</p>';
    return;
  }
  container.innerHTML = correctLines.map((line, idx) => `
    <div class="line-card">
      <div class="head">
        <span class="name">${escapeHtml(line.product_name)}</span>
        <button class="remove" data-correct-remove="${idx}">Remove</button>
      </div>
      <div class="qty-row">
        <div class="qty-field"><label>Cartons</label><input type="number" min="0" inputmode="numeric" data-correct-qty="${idx}" data-unit="cartons" value="${line.cartons}"></div>
        ${line.rule && !line.rule.carton_to_pieces ? `<div class="qty-field"><label>Packs</label><input type="number" min="0" inputmode="numeric" data-correct-qty="${idx}" data-unit="packs" value="${line.packs}"></div>` : ''}
        <div class="qty-field"><label>Pieces</label><input type="number" min="0" inputmode="numeric" data-correct-qty="${idx}" data-unit="pieces" value="${line.pieces}"></div>
      </div>
    </div>
  `).join('');
  container.querySelectorAll('[data-correct-remove]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ correctLines.splice(parseInt(btn.dataset.correctRemove,10),1); renderCorrectLines(); });
  });
  container.querySelectorAll('[data-correct-qty]').forEach(input=>{
    input.addEventListener('input', ()=>{
      const idx = parseInt(input.dataset.correctQty, 10);
      const unit = input.dataset.unit;
      const parsed = parseInt(input.value, 10);
      correctLines[idx][unit] = Number.isNaN(parsed) ? 0 : parsed;
    });
    attachZeroClearBehavior(input);
  });
}

document.getElementById('correctAddProductSelect').addEventListener('change', (e)=>{
  const id = parseInt(e.target.value, 10);
  if(!id) return;
  const product = productsCache.find(p=>p.id===id);
  if(correctLines.some(l=>l.product_id===id)){ toast('Already on this record — edit the existing line.'); e.target.value=''; return; }
  correctLines.push({id: null, product_id: id, product_name: product.name, rule: product.packaging_rule, cartons:0, packs:0, pieces:0, line_notes:null});
  e.target.value = '';
  renderCorrectLines();
});

document.getElementById('correctCancelBtn').addEventListener('click', ()=>{
  document.getElementById('correctPanel').classList.add('hidden');
});

document.getElementById('correctSaveBtn').addEventListener('click', async ()=>{
  const msg = document.getElementById('correctMsg');
  const reason = document.getElementById('correctReason').value.trim();
  if(!reason){ msg.textContent = 'A correction reason is required.'; msg.className = 'msg err'; return; }
  if(correctLines.length === 0){ msg.textContent = 'At least one product line is required.'; msg.className = 'msg err'; return; }

  const freeTextName = correctSelectedCustomer ? null : (document.getElementById('correctReturnedBySearch').value.trim() || null);
  const body = {
    reason, notes: document.getElementById('correctNotes').value,
    expected_updated_at: currentDetail.updated_at,
    date: document.getElementById('correctDate').value || undefined,
    customer_id: correctSelectedCustomer ? correctSelectedCustomer.id : null,
    returned_by_name: freeTextName,
    signed_by_name: document.getElementById('correctSignedByName').value || null,
    lines: correctLines.map(l => ({id: l.id, product_id: l.product_id, cartons: l.cartons, packs: l.packs, pieces: l.pieces, line_notes: l.line_notes})),
  };
  const r = await api(`/api/returns/${currentDetail.id}/correct`, {method:'POST', body: JSON.stringify(body)});
  if(r.status !== 200){
    msg.textContent = r.data.error || 'Could not save correction.'; msg.className = 'msg err';
    return;
  }
  toast('Correction saved.');
  document.getElementById('correctPanel').classList.add('hidden');
  openDetail(currentDetail.id);
});

// ---------- Delete (permanent hard delete) ----------
function openDeletePanel(data){
  document.getElementById('previewPanel').classList.add('hidden');
  const productsSummary = data.lines.map(l => `${l.product_name} (${l.quantity_label})`).join(', ');
  document.getElementById('deleteSummary').innerHTML =
    `<strong>Return #${data.id}</strong> · ${escapeHtml(data.date)} · ${escapeHtml(data.returned_by_name || '—')}<br>` +
    `${escapeHtml(productsSummary)}<br>Status: ${escapeHtml(data.status)}`;
  document.getElementById('deleteReason').value = '';
  document.getElementById('deleteMsg').textContent = '';
  document.getElementById('deletePanel').classList.remove('hidden');
  document.getElementById('deletePanel').scrollIntoView({behavior:'smooth'});
}
document.getElementById('deleteCancelBtn').addEventListener('click', ()=>{
  document.getElementById('deletePanel').classList.add('hidden');
});
document.getElementById('deleteConfirmBtn').addEventListener('click', async ()=>{
  const msg = document.getElementById('deleteMsg');
  const reason = document.getElementById('deleteReason').value.trim();
  if(!reason){ msg.textContent = 'A deletion reason is required.'; msg.className = 'msg err'; return; }
  if(!confirm('Delete this Return permanently? This cannot be undone.')) return;

  const r = await api(`/api/returns/${currentDetail.id}`, {method:'DELETE', body: JSON.stringify({reason, confirm: true})});
  if(r.status !== 200){
    msg.textContent = r.data.error || 'Could not delete return.'; msg.className = 'msg err';
    return;
  }
  toast('Return deleted.');
  document.getElementById('deletePanel').classList.add('hidden');
  switchTab('list');
});

// ---------- boot ----------
(async function init(){
  const {data} = await api('/api/session');
  if(!data.authed || !['super_admin','manager','operator','viewer'].includes((data.user||{}).role)){
    document.getElementById('gate').classList.remove('hidden');
    return;
  }
  currentUser = data.user;
  const isOperatorOrViewer = ['operator','viewer'].includes(data.user.role);
  await applyFeatureFlags();
  document.getElementById('appShell').classList.remove('hidden');
  await loadProducts();
  resetForm();

  const q = new URLSearchParams(window.location.search);
  if(q.get('open')){
    await openDetail(parseInt(q.get('open'), 10));
    switchTab('detail');
  } else {
    const requestedTab = q.get('tab');
    const defaultTab = isOperatorOrViewer ? 'new' : 'list';
    const initialTab = (requestedTab === 'new' || requestedTab === 'list') ? requestedTab : defaultTab;
    loadFilterOptionsFromUrl();
    switchTab(initialTab);
  }
})();
</script>
<script src="/pwa.js" defer></script>
<script src="/app-shell.js" defer></script>
</body>
</html>
