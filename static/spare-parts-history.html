<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1B2430">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spare Parts">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/app-shell.css">
<title>Movement History — Spare Parts</title>
<style>
  :root{
    --ink:#1B2430; --ink-soft:#3D4756; --paper:#FCFAF6; --paper-dim:#F1EEE7; --line:#DEDACF; --teal:#1F8A70; --red:#C1443A;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:var(--sans); background:var(--ink); color:var(--ink); min-height:100vh; }
  .shell{ max-width:640px; margin:0 auto; min-height:100vh; background:var(--paper); display:flex; flex-direction:column; }
  .sp-identity-bar{ background:var(--ink); color:var(--paper); padding:12px 16px; }
  .sp-identity-row{ display:flex; align-items:center; gap:8px; font-size:12px; margin-bottom:8px; }
  .sp-username{ font-weight:700; }
  .sp-role{ color:#8A94A6; }
  .sp-change-section{ margin-left:auto; background:none; border:1px solid #3D4756; color:#8A94A6; border-radius:6px; padding:4px 8px; font-size:11px; cursor:pointer; }
  .sp-nav{ display:flex; gap:12px; overflow-x:auto; }
  .sp-nav-link{ color:#8A94A6; text-decoration:none; font-size:12px; font-weight:600; padding-bottom:4px; white-space:nowrap; }
  .sp-nav-link.active{ color:var(--paper); border-bottom:2px solid #E2A93B; }
  header{ padding:18px 20px 14px; }
  header h1{ margin:0; font-size:19px; font-weight:700; }
  main{ flex:1; padding:16px; padding-bottom:60px; }
  .filters{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .filters input, .filters select{ padding:8px; border:1.5px solid var(--line); border-radius:8px; font-size:13px; }
  .export-links a{ font-size:12px; color:var(--teal); text-decoration:underline; margin-right:10px; }
  .date-group{ margin-bottom:8px; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:white; }
  .date-group-head{ padding:10px 12px; display:flex; justify-content:space-between; cursor:pointer; background:var(--paper-dim); font-size:13px; font-weight:700; }
  .date-group-body{ padding:8px 12px; }
  .date-group.collapsed .date-group-body{ display:none; }
  .movement-row{ padding:8px 0; border-bottom:1px solid var(--paper-dim); font-size:13px; }
  .movement-row .meta{ color:var(--ink-soft); font-size:11px; }
  .movement-row.void{ opacity:.5; text-decoration:line-through; }
</style>
</head>
<body>

<div class="shell" id="appShell">
  <div id="appIdentityBar"></div>
  <header><h1>Movement History</h1></header>
  <main>
    <div class="filters">
      <input type="date" id="fDate" title="Exact date">
      <input type="month" id="fMonth" title="Month">
      <input type="date" id="fFrom" title="From">
      <input type="date" id="fTo" title="To">
      <select id="fType">
        <option value="">All types</option>
        <option value="STOCK_IN">Stock In</option>
        <option value="STOCK_OUT">Stock Out</option>
        <option value="ADJUSTMENT_IN">Adjustment In</option>
        <option value="ADJUSTMENT_OUT">Adjustment Out</option>
      </select>
      <input id="fRequestedBy" placeholder="Requested by">
      <button id="applyFiltersBtn">Filter</button>
    </div>
    <div class="export-links" id="exportLinks">
      <a id="exportCsv" href="#">Export CSV</a>
      <a id="exportXlsx" href="#">Export XLSX</a>
      <a id="exportPdf" href="#">Export PDF</a>
    </div>
    <div id="groupedList"></div>
  </main>
</div>

<script src="/pwa.js" defer></script>
<script src="/spare-parts-shell.js" defer></script>
<script>
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function filterParams(){
  const params = new URLSearchParams();
  const date = document.getElementById('fDate').value;
  const month = document.getElementById('fMonth').value;
  const from = document.getElementById('fFrom').value;
  const to = document.getElementById('fTo').value;
  if(date) params.set('date', date);
  else if(month) params.set('month', month.replace('-',''));
  else {
    if(from) params.set('date_from', from);
    if(to) params.set('date_to', to);
  }
  const type = document.getElementById('fType').value;
  if(type) params.set('movement_type', type);
  const requestedBy = document.getElementById('fRequestedBy').value;
  if(requestedBy) params.set('requested_by', requestedBy);
  return params;
}

function groupByDate(rows){
  const groups = {};
  rows.forEach(r => { (groups[r.business_date] = groups[r.business_date] || []).push(r); });
  return Object.keys(groups).sort((a,b)=> a<b?1:-1).map(date => ({date, items: groups[date]}));
}

async function loadHistory(){
  const params = filterParams();
  const res = await fetch('/api/spare-parts/movements?' + params.toString());
  const rows = await res.json();
  const groups = groupByDate(rows);
  document.getElementById('groupedList').innerHTML = groups.length ? groups.map(g => `
    <div class="date-group collapsed">
      <div class="date-group-head" data-toggle-group>
        <span>${g.date}</span><span>${g.items.length} movement(s)</span>
      </div>
      <div class="date-group-body">
        ${g.items.map(m => `
          <div class="movement-row ${m.status === 'void' ? 'void' : ''}">
            ${escapeHtml(m.movement_type)} — ${escapeHtml(m.quantity)} (${escapeHtml(m.reference)})
            <div class="meta">Requested: ${escapeHtml(m.requested_by||'—')} · Approved: ${escapeHtml(m.approved_by||'—')} · ${escapeHtml(m.remarks||'')}</div>
          </div>`).join('')}
      </div>
    </div>`).join('') : '<div style="color:var(--ink-soft);font-size:13px;">No movements found.</div>';

  document.querySelectorAll('[data-toggle-group]').forEach(head => {
    head.addEventListener('click', () => head.closest('.date-group').classList.toggle('collapsed'));
  });

  ['exportCsv','exportXlsx','exportPdf'].forEach((id,i)=>{
    const fmt = ['csv','xlsx','pdf'][i];
    document.getElementById(id).href = '/api/spare-parts/movements/export.'+fmt+'?'+params.toString();
  });
}

document.getElementById('applyFiltersBtn').addEventListener('click', loadHistory);

(async function init(){
  const s = await (await fetch('/api/session')).json();
  if(!s || !s.authed || s.active_section !== 'spare_parts'){ window.location.href = '/'; return; }
  await loadHistory();
})();
</script>
</body>
</html>
