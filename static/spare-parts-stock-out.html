<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1B2430">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spare Parts">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/app-shell.css">
<title>Stock Out — Spare Parts</title>
<style>
  :root{
    --ink:#1B2430; --ink-soft:#3D4756; --paper:#FCFAF6; --paper-dim:#F1EEE7; --line:#DEDACF; --teal:#1F8A70; --red:#C1443A;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:var(--sans); background:var(--ink); color:var(--ink); min-height:100vh; }
  .shell{ max-width:560px; margin:0 auto; min-height:100vh; background:var(--paper); display:flex; flex-direction:column; }
  .sp-identity-bar{ background:var(--ink); color:var(--paper); padding:12px 16px; }
  .sp-identity-row{ display:flex; align-items:center; gap:8px; font-size:12px; margin-bottom:8px; }
  .sp-username{ font-weight:700; }
  .sp-role{ color:#8A94A6; }
  .sp-change-section{ margin-left:auto; background:none; border:1px solid #3D4756; color:#8A94A6; border-radius:6px; padding:4px 8px; font-size:11px; cursor:pointer; }
  .sp-nav{ display:flex; gap:12px; overflow-x:auto; }
  .sp-nav-link{ color:#8A94A6; text-decoration:none; font-size:12px; font-weight:600; padding-bottom:4px; white-space:nowrap; }
  .sp-nav-link.active{ color:var(--paper); border-bottom:2px solid #E2A93B; }
  header{ padding:18px 20px 14px; }
  header h1{ margin:0; font-size:19px; font-weight:700; }
  main{ flex:1; padding:16px; padding-bottom:60px; }
  .card{ background:white; border:1.5px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  label{ display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin-bottom:5px; }
  input, select, textarea{ width:100%; padding:12px 10px; border:1.5px solid var(--line); border-radius:8px; font-size:15px; font-family:var(--sans); background:white; color:var(--ink); }
  .field{ margin-bottom:14px; position:relative; }
  .autocomplete-list{ position:absolute; top:100%; left:0; right:0; background:white; border:1.5px solid var(--line); border-top:none; border-radius:0 0 8px 8px; max-height:220px; overflow-y:auto; z-index:20; }
  .autocomplete-item{ padding:10px; font-size:14px; border-bottom:1px solid var(--paper-dim); cursor:pointer; }
  .autocomplete-item:hover, .autocomplete-item.active{ background:var(--paper-dim); }
  .context{ background:var(--paper-dim); border-radius:8px; padding:10px; font-size:12px; color:var(--ink-soft); margin-bottom:14px; }
  .btn-primary{ width:100%; padding:14px; border-radius:10px; border:none; background:var(--teal); color:white; font-size:15px; font-weight:700; cursor:pointer; }
  .msg{ font-size:13px; margin-top:10px; min-height:18px; }
  .msg.ok{ color:var(--teal); } .msg.err{ color:var(--red); }
  .hidden{ display:none !important; }
</style>
</head>
<body>

<div class="shell" id="appShell">
  <div id="appIdentityBar"></div>
  <header><h1>Stock Out</h1></header>
  <main>
    <div class="card">
      <div class="field"><label>Date</label><input type="date" id="dateInput"></div>
      <div class="field">
        <label>Spare Part</label>
        <input id="spareInput" placeholder="Search spare part...">
        <div class="autocomplete-list hidden" id="spareResults"></div>
      </div>
      <div class="context hidden" id="spareContext"></div>
      <div class="field"><label>Quantity</label><input type="number" step="any" inputmode="decimal" id="qtyInput"></div>
      <div class="field"><label>Department</label>
        <select id="departmentSelect"><option value="">Select department...</option></select>
      </div>
      <div class="field"><label>Machine (optional)</label>
        <select id="machineSelect"><option value="">Select machine...</option></select>
      </div>
      <div class="field">
        <label>Requested By</label>
        <input id="requestedByInput" autocomplete="off">
        <div class="autocomplete-list hidden" id="requestedByResults"></div>
      </div>
      <div class="field">
        <label>Approved By (optional)</label>
        <input id="approvedByInput" autocomplete="off">
        <div class="autocomplete-list hidden" id="approvedByResults"></div>
      </div>
      <div class="field"><label>Remarks (optional)</label><textarea id="remarksInput" rows="2"></textarea></div>
      <button class="btn-primary" id="submitBtn">Record Stock Out</button>
      <div class="msg" id="msg"></div>
    </div>
  </main>
</div>

<script src="/pwa.js" defer></script>
<script src="/spare-parts-shell.js" defer></script>
<script src="/filter-autocomplete.js" defer></script>
<script src="/spare-parts-search.js" defer></script>
<script>
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let spareParts = [];
let departments = [];
let allMachines = [];
let people = [];

function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

let spareAutocomplete, requestedByAutocomplete, approvedByAutocomplete;

function renderSpareContext(){
  const id = spareAutocomplete.selectedId();
  const ctx = document.getElementById('spareContext');
  if(!id){ ctx.classList.add('hidden'); return; }
  const p = spareParts.find(p => String(p.id) === String(id));
  if(!p){ ctx.classList.add('hidden'); return; }
  const machines = (p.machines||[]).map(m=>m.name).join(', ') || '—';
  ctx.innerHTML = `${p.specifications ? 'Specs: '+p.specifications+' · ' : ''}Machine: ${machines}<br>Current stock: ${p.current_stock} ${p.unit}`;
  ctx.classList.remove('hidden');
}

function renderDepartmentOptions(){
  const sel = document.getElementById('departmentSelect');
  sel.innerHTML = '<option value="">Select department...</option>' +
    departments.map(d => `<option value="${d.id}">${escapeHtml(d.name)}</option>`).join('');
}

function renderMachineOptions(){
  const departmentId = document.getElementById('departmentSelect').value;
  const sel = document.getElementById('machineSelect');
  const filtered = departmentId
    ? allMachines.filter(m => !m.department_id || String(m.department_id) === departmentId)
    : allMachines;
  sel.innerHTML = '<option value="">Select machine...</option>' +
    filtered.map(m => `<option value="${m.id}">${escapeHtml(m.name)}</option>`).join('');
}

document.getElementById('departmentSelect').addEventListener('change', renderMachineOptions);

async function loadData(){
  spareParts = await (await fetch('/api/spare-parts')).json();
  departments = await (await fetch('/api/spare-parts/departments')).json();
  allMachines = await (await fetch('/api/spare-parts/machines')).json();
  people = await (await fetch('/api/spare-parts/movements/people')).json();
  renderDepartmentOptions();
  renderMachineOptions();
}

document.getElementById('submitBtn').addEventListener('click', async ()=>{
  const msg = document.getElementById('msg');
  const spareId = spareAutocomplete.selectedId();
  if(!spareId){ msg.textContent = 'Select a spare part.'; msg.className = 'msg err'; return; }
  const departmentId = document.getElementById('departmentSelect').value;
  if(!departmentId){ msg.textContent = 'Select a department.'; msg.className = 'msg err'; return; }
  const machineId = document.getElementById('machineSelect').value;
  const body = {
    spare_part_id: Number(spareId),
    quantity: document.getElementById('qtyInput').value,
    date: document.getElementById('dateInput').value,
    department_id: Number(departmentId),
    machine_id: machineId ? Number(machineId) : null,
    requested_by: document.getElementById('requestedByInput').value,
    approved_by: document.getElementById('approvedByInput').value || null,
    remarks: document.getElementById('remarksInput').value || null,
  };
  const res = await fetch('/api/spare-parts/movements/stock-out', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body),
  });
  const data = await res.json();
  if(res.status === 201){
    msg.textContent = 'Stock Out recorded.'; msg.className = 'msg ok';
    document.getElementById('qtyInput').value = '';
    document.getElementById('requestedByInput').value = '';
    document.getElementById('approvedByInput').value = '';
    document.getElementById('remarksInput').value = '';
    await loadData();
    renderSpareContext();
  } else {
    msg.textContent = data.error || 'Failed to record Stock Out.'; msg.className = 'msg err';
  }
});

(async function init(){
  const s = await (await fetch('/api/session')).json();
  if(!s || !s.authed || s.active_section !== 'spare_parts'){ window.location.href = '/'; return; }
  document.getElementById('dateInput').value = todayStr();
  await loadData();
  spareAutocomplete = FilterAutocomplete.create({
    inputId:'spareInput', resultsId:'spareResults', onChange: renderSpareContext,
    source: SparePartSearch.source(), label: SparePartSearch.label, meta: SparePartSearch.meta,
  });
  // Requested By / Approved By: plain text fields, autocomplete only
  // suggests — the field's own typed value is always what gets
  // submitted, never a resolved id, so a name not in the list remains valid.
  requestedByAutocomplete = FilterAutocomplete.create({
    inputId:'requestedByInput', resultsId:'requestedByResults', onChange: ()=>{},
    source: async q => people.filter(n => n.toLowerCase().includes(q.toLowerCase())).slice(0,20).map(n => ({id:n, name:n})),
  });
  approvedByAutocomplete = FilterAutocomplete.create({
    inputId:'approvedByInput', resultsId:'approvedByResults', onChange: ()=>{},
    source: async q => people.filter(n => n.toLowerCase().includes(q.toLowerCase())).slice(0,20).map(n => ({id:n, name:n})),
  });
})();
</script>
</body>
</html>
