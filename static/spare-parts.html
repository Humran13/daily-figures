<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1B2430">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spare Parts">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/app-shell.css">
<title>Spare Parts — Store Department</title>
<style>
  :root{
    --ink:#1B2430; --ink-soft:#3D4756; --paper:#FCFAF6; --paper-dim:#F1EEE7; --line:#DEDACF;
    --teal:#1F8A70; --amber:#E2A93B; --red:#C1443A;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:var(--sans); background:var(--ink); color:var(--ink); min-height:100vh; }
  .shell{ max-width:560px; margin:0 auto; min-height:100vh; background:var(--paper); display:flex; flex-direction:column; }
  .sp-identity-bar{ background:var(--ink); color:var(--paper); padding:12px 16px; }
  .sp-identity-row{ display:flex; align-items:center; gap:8px; font-size:12px; margin-bottom:8px; }
  .sp-username{ font-weight:700; }
  .sp-role{ color:#8A94A6; }
  .sp-change-section{ margin-left:auto; background:none; border:1px solid #3D4756; color:#8A94A6; border-radius:6px; padding:4px 8px; font-size:11px; cursor:pointer; }
  .sp-nav{ display:flex; gap:12px; overflow-x:auto; }
  .sp-nav-link{ color:#8A94A6; text-decoration:none; font-size:12px; font-weight:600; padding-bottom:4px; white-space:nowrap; }
  .sp-nav-link.active{ color:var(--paper); border-bottom:2px solid var(--amber); }
  header{ padding:18px 20px 14px; }
  header .eyebrow{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); margin:0 0 4px; }
  header h1{ margin:0; font-size:19px; font-weight:700; }
  main{ flex:1; padding:16px; padding-bottom:60px; }
  .cards{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .card{ background:white; border:1.5px solid var(--line); border-radius:14px; padding:14px; }
  .card-link{ display:block; width:100%; color:inherit; text-decoration:none; text-align:left; cursor:pointer; transition:border-color .15s ease, box-shadow .15s ease; }
  .card-link:hover{ border-color:var(--teal); box-shadow:0 2px 8px rgba(27,36,48,.12); }
  .card-link:focus-visible{ outline:3px solid rgba(31,138,112,.35); outline-offset:2px; }
  .card-link.active{ border-width:2px; box-shadow:0 2px 8px rgba(27,36,48,.16); }
  .card .num{ font-size:24px; font-weight:800; }
  .card .label{ font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; }
  .card.healthy .num{ color:var(--teal); } .card.low .num{ color:#B66D00; } .card.none .num{ color:var(--red); }
  .section-title{ font-size:13px; font-weight:700; margin:18px 0 8px; }
  .list-item{ background:white; border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; font-size:13px; }
  .list-item .meta{ color:var(--ink-soft); font-size:11px; }
  .inventory-head{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin:18px 0 8px; }
  .inventory-head .section-title{ margin:0; }
  .clear-filter{ color:var(--teal); font-size:12px; }
  .inventory-filters{ display:flex; gap:8px; margin:0 0 10px; flex-wrap:wrap; }
  .inventory-filters input[type=text]{ flex:1 1 160px; min-width:120px; font-size:12px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; font-family:inherit; }
  .inventory-filters select{ flex:1 1 140px; min-width:120px; font-size:12px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:white; font-family:inherit; }
  .inventory-filters .reset-filters{ flex:0 0 auto; font-size:12px; color:var(--teal); background:none; border:1px solid var(--line); border-radius:6px; padding:6px 10px; cursor:pointer; }
  @media (max-width:480px){ .inventory-filters input[type=text], .inventory-filters select{ flex:1 1 100%; } }
  .inventory-row{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px 12px; }
  .inventory-row strong{ overflow-wrap:anywhere; }
  .inventory-row .stock{ text-align:right; white-space:nowrap; font-weight:700; }
  .inventory-row.healthy .stock{ color:var(--teal); }
  .inventory-row.low .stock, .inventory-row.no_stock .stock{ color:var(--red); }
  .hidden{ display:none !important; }
  .period-select{ font-size:12px; padding:4px 8px; border:1px solid var(--line); border-radius:6px; background:white; font-family:inherit; }
  .rank-row{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .rank-row .rank-name{ overflow-wrap:anywhere; }
  .rank-row .rank-qty{ white-space:nowrap; font-weight:700; }
</style>
</head>
<body>

<div class="shell" id="appShell">
  <div id="appIdentityBar"></div>
  <header>
    <p class="eyebrow">Store Department</p>
    <h1>Spare Parts Dashboard</h1>
  </header>
  <main>
    <div class="cards">
      <div class="card"><div class="num" id="cardTotalActive">-</div><div class="label">Active Spare Parts</div></div>
      <a class="card card-link healthy" data-stock-filter="healthy" href="/spare-parts.html?stock=healthy#inventory" aria-label="View healthy-stock items"><div class="num" id="cardWithStock">-</div><div class="label">Healthy Stock</div></a>
      <a class="card card-link low" data-stock-filter="low" href="/spare-parts.html?stock=low#inventory" aria-label="View low-stock items"><div class="num" id="cardLowStock">-</div><div class="label">Low Stock</div></a>
      <a class="card card-link none" data-stock-filter="no_stock" href="/spare-parts.html?stock=no_stock#inventory" aria-label="View out-of-stock items"><div class="num" id="cardNoStock">-</div><div class="label">No Stock</div></a>
    </div>

    <section id="inventory" class="hidden" aria-live="polite">
      <div class="inventory-head"><div class="section-title" id="inventoryTitle"></div><button class="clear-filter" type="button" id="clearInventoryFilter">Clear filter</button></div>
      <div class="inventory-filters">
        <input type="text" id="inventorySearch" placeholder="Search spare part..." aria-label="Search spare parts">
        <select id="inventoryCategoryFilter" aria-label="Filter by category"><option value="">All Categories</option></select>
        <button type="button" class="reset-filters" id="resetInventoryFilters">Reset</button>
      </div>
      <div id="inventoryList"></div>
    </section>

    <div class="inventory-head">
      <div class="section-title">Most Taken Out Spare Parts</div>
      <select class="period-select" id="mostIssuedPeriod" aria-label="Period">
        <option value="30">Last 30 days</option>
        <option value="90">Last 90 days</option>
        <option value="180">Last 180 days</option>
        <option value="365" selected>Last 365 days</option>
        <option value="all">All time</option>
      </select>
    </div>
    <div id="mostIssuedList"></div>

    <div class="section-title">Recent Movements</div>
    <div id="recentMovementsList"></div>
  </main>
</div>

<script src="/pwa.js" defer></script>
<script src="/spare-parts-shell.js" defer></script>
<script src="/spare-parts-ui.js"></script>
<script>
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadDashboard(){
  const res = await fetch('/api/spare-parts/dashboard');
  const data = await res.json();
  document.getElementById('cardTotalActive').textContent = data.total_active_spare_parts;
  document.getElementById('cardWithStock').textContent = data.healthy_stock_count;
  document.getElementById('cardLowStock').textContent = data.low_stock_count;
  document.getElementById('cardNoStock').textContent = data.no_stock_count;

  const recentEl = document.getElementById('recentMovementsList');
  recentEl.innerHTML = data.recent_movements.length
    ? data.recent_movements.map(m => `<div class="list-item"><strong>${escapeHtml(m.spare_part_display_name)}</strong><br>${escapeHtml(m.movement_type)} — ${escapeHtml(SparePartsUI.formatQuantity(m.quantity))} ${escapeHtml(m.unit_snapshot||'')}<div class="meta">Event: ${escapeHtml(m.business_date)} · Recorded: ${escapeHtml((m.created_at||'').replace('T',' ').slice(0,16))} · ${escapeHtml(m.reference)}</div></div>`).join('')
    : '<div class="meta" style="color:var(--ink-soft);padding:6px 0;">None yet</div>';
}

async function loadMostIssued(days){
  const el = document.getElementById('mostIssuedList');
  try{
    const res = await fetch('/api/spare-parts/dashboard/most-issued?days=' + encodeURIComponent(days));
    if(!res.ok) throw new Error('Unable to load.');
    const data = await res.json();
    const results = data.results || [];
    el.innerHTML = results.length ? results.map((r, i) => `
      <div class="list-item rank-row">
        <div class="rank-name"><strong>${i + 1}. ${escapeHtml(r.display_name)}</strong></div>
        <div class="rank-qty">${escapeHtml(SparePartsUI.formatQuantity(r.total_quantity))} ${escapeHtml(r.unit)}<div class="meta">${r.issue_count} issue${r.issue_count === 1 ? '' : 's'}</div></div>
      </div>`).join('') : '<div class="meta" style="color:var(--ink-soft);padding:6px 0;">No Stock Out activity for this period.</div>';
  }catch(err){
    el.innerHTML = '<div class="meta" role="alert" style="color:var(--red);padding:6px 0;">Could not load this ranking.</div>';
  }
}

let selectedStockFilter = null;
let selectedCategoryId = '';
let searchText = '';
let inventoryRequestId = 0;
let inventorySearchDebounce = null;
const STOCK_FILTER_LABELS = {healthy:'Healthy Stock', low:'Low Stock', no_stock:'No Stock'};

function setInventoryUrl(stock, mode){
  const url = new URL(window.location.href);
  if(stock) url.searchParams.set('stock', stock); else url.searchParams.delete('stock');
  if(stock && selectedCategoryId) url.searchParams.set('category_id', selectedCategoryId); else url.searchParams.delete('category_id');
  if(stock && searchText) url.searchParams.set('q', searchText); else url.searchParams.delete('q');
  url.hash = stock ? '#inventory' : '';
  const state = {stock: stock || null, category_id: stock ? (selectedCategoryId || null) : null, q: stock ? (searchText || null) : null};
  if(mode === 'replace') history.replaceState(state, '', url);
  else history.pushState(state, '', url);
}

async function loadCategoriesOnce(){
  const select = document.getElementById('inventoryCategoryFilter');
  try{
    const res = await fetch('/api/spare-parts/categories');
    if(!res.ok) throw new Error('Unable to load categories.');
    const categories = await res.json();
    if(!Array.isArray(categories)) throw new Error('Unable to load categories.');
    const keep = selectedCategoryId;
    select.innerHTML = '<option value="">All Categories</option>' +
      categories.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
    select.value = keep;
    select.disabled = false;
  }catch(err){
    select.innerHTML = '<option value="">All Categories</option>';
    select.disabled = true;
  }
}

async function loadFilteredInventory(stock, options){
  if(!Object.prototype.hasOwnProperty.call(STOCK_FILTER_LABELS, stock)) return;
  const opts = options || {};
  const requestId = ++inventoryRequestId;
  selectedStockFilter = stock;
  document.querySelectorAll('[data-stock-filter]').forEach(card => card.classList.toggle('active', card.dataset.stockFilter === stock));
  const section = document.getElementById('inventory');
  document.getElementById('inventoryTitle').textContent = 'Inventory — ' + STOCK_FILTER_LABELS[stock];
  section.classList.remove('hidden');
  document.getElementById('inventoryCategoryFilter').value = selectedCategoryId;
  document.getElementById('inventorySearch').value = searchText;
  if(opts.updateUrl !== false) setInventoryUrl(stock, opts.urlMode);

  try{
    const params = new URLSearchParams({stock});
    if(selectedCategoryId) params.set('category_id', selectedCategoryId);
    if(searchText) params.set('q', searchText);
    const res = await fetch('/api/spare-parts?' + params.toString());
    if(!res.ok) throw new Error('Unable to load inventory.');
    const parts = await res.json();
    if(!Array.isArray(parts)) throw new Error('Unable to load inventory.');
    // A slower earlier request must never overwrite the filter the user has
    // since chosen (or the cleared state).
    if(requestId !== inventoryRequestId) return;
    document.getElementById('inventoryList').innerHTML = parts.length ? parts.map(p => `
      <div class="list-item inventory-row ${escapeHtml(p.stock_status)}">
        <div><strong>${escapeHtml(p.display_name)}</strong><div class="meta">${escapeHtml(p.code||'No code')}</div></div>
        <div class="stock">${escapeHtml(SparePartsUI.formatQuantity(p.current_stock))} ${escapeHtml(p.unit)}<div class="meta">Minimum: ${p.minimum_stock == null ? '—' : escapeHtml(SparePartsUI.formatQuantity(p.minimum_stock)) + ' ' + escapeHtml(p.unit)}</div></div>
      </div>`).join('') : '<div class="meta" style="color:var(--ink-soft);padding:6px 0;">No matching spare parts.</div>';
  }catch(err){
    if(requestId !== inventoryRequestId) return;
    document.getElementById('inventoryList').innerHTML = '<div class="meta" role="alert" style="color:var(--red);padding:6px 0;">Inventory could not be loaded. Please try again.</div>';
    SparePartsUI.notify(err.message || 'Inventory could not be loaded.', 'error');
  }
}

function clearInventoryFilter(options){
  const opts = options || {};
  inventoryRequestId++;
  selectedStockFilter = null;
  selectedCategoryId = '';
  searchText = '';
  document.getElementById('inventoryCategoryFilter').value = '';
  document.getElementById('inventorySearch').value = '';
  document.getElementById('inventory').classList.add('hidden');
  document.getElementById('inventoryList').innerHTML = '';
  document.querySelectorAll('[data-stock-filter]').forEach(card => card.classList.remove('active'));
  if(opts.updateUrl !== false) setInventoryUrl(null, opts.urlMode || 'replace');
}

(async function init(){
  const s = await (await fetch('/api/session')).json();
  if(!s || !s.authed || s.active_section !== 'spare_parts'){
    window.location.href = '/';
    return;
  }
  await loadDashboard();
  await loadMostIssued(document.getElementById('mostIssuedPeriod').value);
  loadCategoriesOnce();
  document.getElementById('mostIssuedPeriod').addEventListener('change', event => loadMostIssued(event.target.value));
  document.querySelectorAll('[data-stock-filter]').forEach(card => card.addEventListener('click', event => {
    event.preventDefault();
    loadFilteredInventory(card.dataset.stockFilter);
  }));
  document.getElementById('clearInventoryFilter').addEventListener('click', () => clearInventoryFilter());
  document.getElementById('inventoryCategoryFilter').addEventListener('change', event => {
    selectedCategoryId = event.target.value;
    if(selectedStockFilter) loadFilteredInventory(selectedStockFilter, {urlMode:'replace'});
  });
  document.getElementById('inventorySearch').addEventListener('input', event => {
    searchText = event.target.value.trim();
    clearTimeout(inventorySearchDebounce);
    inventorySearchDebounce = setTimeout(() => {
      if(selectedStockFilter) loadFilteredInventory(selectedStockFilter, {urlMode:'replace'});
    }, 250);
  });
  document.getElementById('resetInventoryFilters').addEventListener('click', () => {
    selectedCategoryId = '';
    searchText = '';
    document.getElementById('inventoryCategoryFilter').value = '';
    document.getElementById('inventorySearch').value = '';
    if(selectedStockFilter) loadFilteredInventory(selectedStockFilter, {urlMode:'replace'});
  });
  window.addEventListener('popstate', event => {
    const state = event.state || {};
    if(state.stock){
      selectedCategoryId = state.category_id || '';
      searchText = state.q || '';
      loadFilteredInventory(state.stock, {updateUrl:false});
    } else {
      clearInventoryFilter({updateUrl:false});
    }
  });
  const initialParams = new URLSearchParams(window.location.search);
  const initialStock = initialParams.get('stock');
  if(Object.prototype.hasOwnProperty.call(STOCK_FILTER_LABELS, initialStock)){
    selectedCategoryId = initialParams.get('category_id') || '';
    searchText = initialParams.get('q') || '';
    await loadFilteredInventory(initialStock, {updateUrl:false});
    // Give this first history entry a state too, so Back returns to the
    // URL-restored filter instead of clearing it.
    setInventoryUrl(initialStock, 'replace');
  }
})();
</script>
</body>
</html>
