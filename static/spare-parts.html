<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1B2430">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spare Parts">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/app-shell.css">
<title>Spare Parts — Store Department</title>
<style>
  :root{
    --ink:#1B2430; --ink-soft:#3D4756; --paper:#FCFAF6; --paper-dim:#F1EEE7; --line:#DEDACF;
    --teal:#1F8A70; --amber:#E2A93B; --red:#C1443A;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:var(--sans); background:var(--ink); color:var(--ink); min-height:100vh; }
  .shell{ max-width:560px; margin:0 auto; min-height:100vh; background:var(--paper); display:flex; flex-direction:column; }
  .sp-identity-bar{ background:var(--ink); color:var(--paper); padding:12px 16px; }
  .sp-identity-row{ display:flex; align-items:center; gap:8px; font-size:12px; margin-bottom:8px; }
  .sp-username{ font-weight:700; }
  .sp-role{ color:#8A94A6; }
  .sp-change-section{ margin-left:auto; background:none; border:1px solid #3D4756; color:#8A94A6; border-radius:6px; padding:4px 8px; font-size:11px; cursor:pointer; }
  .sp-nav{ display:flex; gap:12px; overflow-x:auto; }
  .sp-nav-link{ color:#8A94A6; text-decoration:none; font-size:12px; font-weight:600; padding-bottom:4px; white-space:nowrap; }
  .sp-nav-link.active{ color:var(--paper); border-bottom:2px solid var(--amber); }
  header{ padding:18px 20px 14px; }
  header .eyebrow{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); margin:0 0 4px; }
  header h1{ margin:0; font-size:19px; font-weight:700; }
  main{ flex:1; padding:16px; padding-bottom:60px; }
  .cards{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .card{ background:white; border:1.5px solid var(--line); border-radius:14px; padding:14px; }
  .card-link{ display:block; color:inherit; text-decoration:none; cursor:pointer; transition:border-color .15s ease, box-shadow .15s ease; }
  .card-link:hover{ border-color:var(--teal); box-shadow:0 2px 8px rgba(27,36,48,.12); }
  .card-link:focus-visible{ outline:3px solid rgba(31,138,112,.35); outline-offset:2px; }
  .card .num{ font-size:24px; font-weight:800; }
  .card .label{ font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; }
  .card.low .num{ color:var(--red); }
  .section-title{ font-size:13px; font-weight:700; margin:18px 0 8px; }
  .list-item{ background:white; border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; font-size:13px; }
  .list-item .meta{ color:var(--ink-soft); font-size:11px; }
  .inventory-head{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin:18px 0 8px; }
  .inventory-head .section-title{ margin:0; }
  .clear-filter{ color:var(--teal); font-size:12px; }
  .inventory-row{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px 12px; }
  .inventory-row strong{ overflow-wrap:anywhere; }
  .inventory-row .stock{ text-align:right; white-space:nowrap; font-weight:700; }
  .hidden{ display:none !important; }
</style>
</head>
<body>

<div class="shell" id="appShell">
  <div id="appIdentityBar"></div>
  <header>
    <p class="eyebrow">Store Department</p>
    <h1>Spare Parts Dashboard</h1>
  </header>
  <main>
    <div class="cards">
      <div class="card"><div class="num" id="cardTotalActive">-</div><div class="label">Active Spare Parts</div></div>
      <a class="card card-link" href="/spare-parts.html?stock=in_stock#inventory" aria-label="View items with stock"><div class="num" id="cardWithStock">-</div><div class="label">Items With Stock</div></a>
      <a class="card card-link low" href="/spare-parts.html?stock=low#inventory" aria-label="View low-stock items"><div class="num" id="cardLowStock">-</div><div class="label">Low Stock</div></a>
      <div class="card"><div class="num" id="cardStockInToday">-</div><div class="label">Stock In Today</div></div>
      <div class="card"><div class="num" id="cardStockOutToday">-</div><div class="label">Stock Out Today</div></div>
    </div>

    <div class="section-title">Low Stock</div>
    <div id="lowStockList"></div>

    <section id="inventory" class="hidden" aria-live="polite">
      <div class="inventory-head"><div class="section-title" id="inventoryTitle"></div><a class="clear-filter" href="/spare-parts.html">Clear filter</a></div>
      <div id="inventoryList"></div>
    </section>

    <div class="section-title">Recent Movements</div>
    <div id="recentMovementsList"></div>
  </main>
</div>

<script src="/pwa.js" defer></script>
<script src="/spare-parts-shell.js" defer></script>
<script>
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadDashboard(){
  const res = await fetch('/api/spare-parts/dashboard');
  const data = await res.json();
  document.getElementById('cardTotalActive').textContent = data.total_active_spare_parts;
  document.getElementById('cardWithStock').textContent = data.current_stock_items;
  document.getElementById('cardLowStock').textContent = data.low_stock_count;
  document.getElementById('cardStockInToday').textContent = data.stock_in_today;
  document.getElementById('cardStockOutToday').textContent = data.stock_out_today;

  const lowStockEl = document.getElementById('lowStockList');
  lowStockEl.innerHTML = data.low_stock.length
    ? data.low_stock.map(p => `<div class="list-item"><strong>${escapeHtml(p.display_name)}</strong><div class="meta">Stock: ${escapeHtml(p.current_stock)} ${escapeHtml(p.unit)} / Min: ${escapeHtml(p.minimum_stock)} ${escapeHtml(p.unit)}</div></div>`).join('')
    : '<div class="meta" style="color:var(--ink-soft);padding:6px 0;">None</div>';

  const recentEl = document.getElementById('recentMovementsList');
  recentEl.innerHTML = data.recent_movements.length
    ? data.recent_movements.map(m => `<div class="list-item"><strong>${escapeHtml(m.spare_part_display_name)}</strong><br>${escapeHtml(m.movement_type)} — ${escapeHtml(m.quantity)} ${escapeHtml(m.unit_snapshot||'')}<div class="meta">${escapeHtml(m.business_date)} · ${escapeHtml(m.reference)}</div></div>`).join('')
    : '<div class="meta" style="color:var(--ink-soft);padding:6px 0;">None yet</div>';
}

async function loadFilteredInventory(){
  const stock = new URLSearchParams(window.location.search).get('stock');
  if(stock !== 'low' && stock !== 'in_stock') return;
  const section = document.getElementById('inventory');
  const title = stock === 'low' ? 'Inventory — Low Stock' : 'Inventory — Items With Stock';
  document.getElementById('inventoryTitle').textContent = title;
  section.classList.remove('hidden');
  const res = await fetch('/api/spare-parts?stock=' + encodeURIComponent(stock));
  const parts = await res.json();
  document.getElementById('inventoryList').innerHTML = parts.length ? parts.map(p => `
    <div class="list-item inventory-row">
      <div><strong>${escapeHtml(p.display_name)}</strong><div class="meta">${escapeHtml(p.code||'No code')}</div></div>
      <div class="stock">${escapeHtml(p.current_stock)} ${escapeHtml(p.unit)}<div class="meta">Minimum: ${escapeHtml(p.minimum_stock == null ? '—' : p.minimum_stock)} ${escapeHtml(p.unit)}</div></div>
    </div>`).join('') : '<div class="meta" style="color:var(--ink-soft);padding:6px 0;">No matching spare parts.</div>';
}

(async function init(){
  const s = await (await fetch('/api/session')).json();
  if(!s || !s.authed || s.active_section !== 'spare_parts'){
    window.location.href = '/';
    return;
  }
  await loadDashboard();
  await loadFilteredInventory();
})();
</script>
</body>
</html>
