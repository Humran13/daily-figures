services:
  daily-figures:
    build: .
    container_name: daily_figures_app
    restart: unless-stopped
    ports:
      # Bound to localhost only — CloudPanel's reverse proxy talks to this
      # over 127.0.0.1; the Flask/Gunicorn port is never exposed publicly.
      # Do not change this to "5000:5000" (all-interfaces) in production.
      - "${DAILY_FIGURES_BIND_ADDRESS:-127.0.0.1}:${DAILY_FIGURES_PORT:-5000}:5000"
    env_file:
      - ${DAILY_FIGURES_ENV_FILE:-.env}
    environment:
      - DB_PATH=/app/data/production.db
    volumes:
      # No local-development fallback here on purpose: a bare
      # `docker compose up -d --build` in a production checkout must fail
      # before any container is created rather than silently binding
      # ./data (see the incident in docs/MIGRATION-FROM-OPT.md). For local
      # development, export DAILY_FIGURES_DATA_DIR explicitly (see
      # docker-compose.dev.yml) -- Compose interpolates each -f file
      # independently before merging, so an override file alone cannot make
      # this optional.
      - ${DAILY_FIGURES_DATA_DIR:?DAILY_FIGURES_DATA_DIR must be explicitly set; see docker-compose.dev.yml for local development}:/app/data
